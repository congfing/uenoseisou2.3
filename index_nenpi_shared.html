<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>燃費共有読込</title>
  <script>
    if (window.self !== window.top || new URLSearchParams(location.search).get("embedded") === "1") {
      document.documentElement.classList.add("embedded");
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #fff;
      --ink: #000;
      --muted: #333;
      --line: #000;
      --soft: #f2f2f2;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    button, input, select {
      max-width: 100%;
      min-width: 0;
      font: inherit;
    }
    .titlebar {
      display: grid;
      grid-template-columns: 78px 1fr minmax(120px, 240px);
      align-items: center;
      min-height: 22px;
      border: 1px solid var(--line);
      line-height: 1;
      background: #fff;
    }
    .embedded .titlebar { display: none; }
    .lights {
      height: 100%;
      display: flex;
      gap: 6px;
      align-items: center;
      padding-left: 7px;
      border-right: 1px solid var(--line);
    }
    .light {
      width: 12px;
      height: 12px;
      min-height: 12px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
    }
    .red { background: #ff5f57; border-color: #e0443e; }
    .yellow { background: #febc2e; border-color: #d89e24; }
    .green { background: #28c840; border-color: #1eab33; }
    .bar-title, .bar-file {
      overflow: hidden;
      padding: 0 8px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .bar-title {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
    }
    .bar-file {
      font-size: 11px;
      text-align: right;
    }
    .app {
      width: min(1120px, calc(100% - 24px));
      margin: 0 auto;
      padding: 18px 0 34px;
    }
    .box {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }
    .box + .box { margin-top: 14px; }
    .box-title {
      display: inline-block;
      margin: 0;
      padding: 4px 9px;
      border: 2px solid var(--line);
      border-radius: 8px;
      font-size: 22px;
      line-height: 1.2;
      background: var(--soft);
    }
    .note {
      margin: 9px 0 14px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    label {
      display: grid;
      gap: 5px;
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
    }
    select, input {
      width: 100%;
      min-height: 42px;
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      background: #fff;
      color: #000;
    }
    .mode-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      min-height: 42px;
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 8px 14px;
      background: #fff;
      font-weight: 800;
    }
    .btn.active { background: var(--soft); }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px;
      text-align: left;
      white-space: nowrap;
      font-size: 14px;
    }
    th {
      background: var(--soft);
      font-weight: 900;
    }
    tr:last-child td { border-bottom: 0; }
    .empty {
      border: 2px dashed var(--line);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      color: var(--muted);
    }
    .chart-box {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      overflow: hidden;
      background: #fff;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 220px;
    }
    .chart-text {
      fill: #000;
      font-size: 12px;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }
    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .app { width: calc(100% - 14px); padding-top: 10px; }
    }
    @media (max-width: 480px) {
      .titlebar { grid-template-columns: 68px 1fr minmax(92px, 34vw); }
      .controls { grid-template-columns: 1fr; }
      .box { padding: 10px; }
      .box-title { font-size: 20px; }
      table { min-width: 680px; }
      th, td { padding: 8px; font-size: 13px; }
      .note { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="lights" aria-label="画面操作">
      <button class="light red" type="button" data-action="home" aria-label="起動画面へ戻る"></button>
      <button class="light yellow" type="button" data-action="home" aria-label="起動画面へ戻る"></button>
      <button class="light green" type="button" data-action="reload" aria-label="再読み込み"></button>
    </div>
    <div class="bar-title">上野清掃2.3 v2-3</div>
    <div class="bar-file">index_nenpi_shared.html</div>
  </header>

  <main class="app">
    <section class="box">
      <h1 class="box-title">燃費表共有 読込</h1>
    </section>
    <div class="note" id="sourceNote">起動時に読込中です。</div>

    <section class="box">
      <h2 class="box-title">選択</h2>
    </section>
    <div class="note">年・月・車番を選択して、計算した燃費をリストまたはグラフで確認します。</div>

    <section class="box">
      <div class="controls">
        <label>Sheet
          <select id="sheetSelect"></select>
        </label>
        <label>年
          <select id="yearSelect"></select>
        </label>
        <label>月
          <select id="monthSelect"></select>
        </label>
        <label>車番・車種
          <select id="vehicleSelect"></select>
        </label>
      </div>
      <div class="mode-row">
        <button class="btn active" type="button" data-mode="list">燃費リスト</button>
        <button class="btn" type="button" data-mode="graph">燃費グラフ</button>
      </div>
    </section>

    <section class="box" id="outputBox">
      <h2 class="box-title" id="outputTitle">燃費リスト</h2>
    </section>
    <div class="note" id="outputNote">表示内容は確認用です。</div>
    <div id="output"></div>
  </main>

  <script src="nenpi_shared_data.js"></script>
  <script>
    const workbook = window.NENPI_SHARED_WORKBOOK || { sheets: [] };
    const state = { sheet: "", year: "", month: "", vehicle: "", mode: "list" };
    const el = {
      sourceNote: document.getElementById("sourceNote"),
      sheet: document.getElementById("sheetSelect"),
      year: document.getElementById("yearSelect"),
      month: document.getElementById("monthSelect"),
      vehicle: document.getElementById("vehicleSelect"),
      output: document.getElementById("output"),
      outputTitle: document.getElementById("outputTitle"),
      outputNote: document.getElementById("outputNote")
    };

    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.action === "reload") location.reload();
        else location.href = "index.html";
      });
    });

    [el.sheet, el.year, el.month, el.vehicle].forEach((select) => {
      select.addEventListener("change", () => {
        state.sheet = el.sheet.value;
        state.year = el.year.value;
        state.month = el.month.value;
        state.vehicle = el.vehicle.value;
        render();
      });
    });

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        render();
      });
    });

    initialize();

    function initialize() {
      el.sourceNote.textContent = `${workbook.sourcePathLabel || "燃費表共有.xlsx"} / 作成 ${workbook.updatedAt || ""}`;
      state.sheet = workbook.sheets.find((sheet) => sheet.name === "記録")?.name || workbook.sheets[0]?.name || "";
      render();
    }

    function render() {
      const sheet = workbook.sheets.find((item) => item.name === state.sheet) || workbook.sheets[0];
      renderSheetOptions();
      if (!sheet) {
        el.output.innerHTML = `<div class="empty">読込データがありません。</div>`;
        return;
      }
      const rows = fuelRowsFromSheet(sheet);
      renderFilterOptions(rows);
      const filtered = filterRows(rows);
      document.querySelectorAll("[data-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === state.mode);
      });
      el.outputTitle.textContent = state.mode === "graph" ? "燃費グラフ" : "燃費リスト";
      el.outputNote.textContent = `${sheet.name} / ${filtered.length}件`;
      el.output.innerHTML = state.mode === "graph" ? graphHtml(filtered) : listHtml(filtered);
    }

    function renderSheetOptions() {
      el.sheet.innerHTML = workbook.sheets.map((sheet) => (
        `<option value="${escapeHtml(sheet.name)}">${escapeHtml(sheet.name)}</option>`
      )).join("");
      el.sheet.value = state.sheet || workbook.sheets[0]?.name || "";
      state.sheet = el.sheet.value;
    }

    function fuelRowsFromSheet(sheet) {
      const headerIndex = sheet.rows.findIndex((row) => row.includes("No") && row.includes("給油日"));
      if (headerIndex < 0) return [];
      const headers = sheet.rows[headerIndex].map((value) => String(value || ""));
      const items = sheet.rows.slice(headerIndex + 1).map((row, index) => {
        const item = { _index: index };
        headers.forEach((header, col) => item[header] = row[col] ?? "");
        return item;
      }).filter((item) => hasValue(item["車番"]) || hasValue(item["給油日"]) || hasValue(item["オドメーター"]));

      const previousByVehicle = new Map();
      return items.map((item) => {
        const vehicle = normalizeVehicle(item["車番"]);
        const odometer = numberOrBlank(item["オドメーター"]);
        const fuel = numberOrBlank(item["給油燃料量(L)"]);
        let distance = numberOrBlank(item["走行距離(km)"]);
        let economy = numberOrBlank(item["燃費(km/L)"]);
        const previous = previousByVehicle.get(vehicle);
        if (distance === "" && odometer !== "" && previous !== undefined) distance = round1(odometer - previous);
        if (economy === "" && distance !== "" && fuel) economy = round1(distance / fuel);
        if (vehicle && odometer !== "") previousByVehicle.set(vehicle, odometer);
        return {
          date: formatDate(item["給油日"]),
          vehicle,
          type: String(item["車種"] || ""),
          driver: String(item["運転者"] || ""),
          odometer,
          distance,
          fuel,
          economy,
          memo: String(item["備考"] || "")
        };
      });
    }

    function renderFilterOptions(rows) {
      const selected = { year: state.year, month: state.month, vehicle: state.vehicle };
      const years = [...new Set(rows.map((row) => dateParts(row.date).year).filter(Boolean))].sort();
      const vehicles = new Map();
      rows.forEach((row) => {
        if (!row.vehicle || vehicles.has(row.vehicle)) return;
        vehicles.set(row.vehicle, [row.vehicle, row.type].filter(Boolean).join(" / "));
      });
      el.year.innerHTML = `<option value="">すべて</option>${years.map((year) => `<option value="${year}">${year}年</option>`).join("")}`;
      el.month.innerHTML = `<option value="">すべて</option>${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${i + 1}月</option>`).join("")}`;
      el.vehicle.innerHTML = `<option value="">すべて</option>${[...vehicles].map(([vehicle, label]) => `<option value="${escapeHtml(vehicle)}">${escapeHtml(label)}</option>`).join("")}`;
      el.year.value = years.includes(selected.year) ? selected.year : "";
      el.month.value = selected.month || "";
      el.vehicle.value = vehicles.has(selected.vehicle) ? selected.vehicle : "";
      state.year = el.year.value;
      state.month = el.month.value;
      state.vehicle = el.vehicle.value;
    }

    function filterRows(rows) {
      return rows.filter((row) => {
        const parts = dateParts(row.date);
        return (!state.year || parts.year === state.year)
          && (!state.month || parts.month === state.month)
          && (!state.vehicle || row.vehicle === state.vehicle);
      });
    }

    function listHtml(rows) {
      if (rows.length === 0) return `<div class="empty">指定条件の記録はありません。</div>`;
      return `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>給油日</th><th>車番</th><th>車種</th><th>運転者</th><th>オドメーター</th><th>走行距離</th><th>給油量</th><th>燃費</th>
            </tr></thead>
            <tbody>
              ${rows.map((row) => `<tr>
                <td>${escapeHtml(row.date)}</td>
                <td>${escapeHtml(row.vehicle)}</td>
                <td>${escapeHtml(row.type)}</td>
                <td>${escapeHtml(row.driver)}</td>
                <td>${escapeHtml(formatValue(row.odometer))}</td>
                <td>${escapeHtml(formatValue(row.distance))}</td>
                <td>${escapeHtml(formatValue(row.fuel))}</td>
                <td>${escapeHtml(formatValue(row.economy))}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function graphHtml(rows) {
      const points = rows.filter((row) => numberOrBlank(row.economy) !== "");
      if (points.length === 0) return `<div class="empty">グラフにできる燃費記録はありません。</div>`;
      const width = 720;
      const height = 260;
      const pad = { left: 46, right: 16, top: 18, bottom: 42 };
      const values = points.map((row) => Number(row.economy));
      const min = Math.max(0, Math.min(...values) - 1);
      const max = Math.max(...values) + 1;
      const step = points.length === 1 ? 0 : (width - pad.left - pad.right) / (points.length - 1);
      const yFor = (value) => pad.top + (max - value) / (max - min || 1) * (height - pad.top - pad.bottom);
      const coords = points.map((row, index) => ({ x: pad.left + step * index, y: yFor(Number(row.economy)), row }));
      const line = coords.map((point) => `${point.x},${point.y}`).join(" ");
      return `
        <div class="chart-box">
          <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="燃費グラフ">
            <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}" stroke="#000" stroke-width="1"></line>
            <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#000" stroke-width="1"></line>
            <text class="chart-text" x="8" y="${pad.top + 8}">${escapeHtml(max.toFixed(1))}</text>
            <text class="chart-text" x="8" y="${height - pad.bottom}">${escapeHtml(min.toFixed(1))}</text>
            ${coords.length > 1 ? `<polyline points="${line}" fill="none" stroke="#000" stroke-width="3"></polyline>` : ""}
            ${coords.map((point) => `
              <circle cx="${point.x}" cy="${point.y}" r="5" fill="#fff" stroke="#000" stroke-width="2"></circle>
              <text class="chart-text" x="${point.x - 14}" y="${point.y - 10}">${escapeHtml(formatValue(point.row.economy))}</text>
              <text class="chart-text" x="${Math.max(4, point.x - 34)}" y="${height - 16}">${escapeHtml(shortDate(point.row.date))}</text>
            `).join("")}
          </svg>
        </div>
      `;
    }

    function hasValue(value) {
      return String(value ?? "").trim() !== "";
    }
    function normalizeVehicle(value) {
      return String(value ?? "").trim().replace(/\\.0$/, "");
    }
    function numberOrBlank(value) {
      if (value === "" || value === null || value === undefined) return "";
      if (typeof value === "string" && value.startsWith("=")) return "";
      const number = Number(String(value).replace(",", "."));
      return Number.isFinite(number) ? number : "";
    }
    function round1(value) {
      return Math.round(Number(value) * 10) / 10;
    }
    function formatDate(value) {
      const text = String(value ?? "").trim();
      const match = text.match(/^(\\d{4})[-/](\\d{1,2})[-/](\\d{1,2})/);
      return match ? `${match[1]}-${String(Number(match[2])).padStart(2, "0")}-${String(Number(match[3])).padStart(2, "0")}` : text;
    }
    function dateParts(value) {
      const match = String(value || "").match(/^(\\d{4})-(\\d{1,2})-/);
      return { year: match ? match[1] : "", month: match ? String(Number(match[2])) : "" };
    }
    function shortDate(value) {
      const match = String(value || "").match(/^\\d{4}-(\\d{1,2})-(\\d{1,2})/);
      return match ? `${Number(match[1])}/${Number(match[2])}` : String(value || "");
    }
    function formatValue(value) {
      return value === "" || value === null || value === undefined ? "" : String(value);
    }
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
