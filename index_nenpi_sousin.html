<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>燃費報告を送信</title>
  <script>
    if (window.self !== window.top || new URLSearchParams(location.search).get("embedded") === "1") {
      document.documentElement.classList.add("embedded");
    }
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #000000;
      --muted: #333333;
      --line: #000000;
      --accent: #000000;
      --accent-strong: #000000;
      --accent-soft: #f2f2f2;
      --danger: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      line-height: 1.55;
    }

    .standalone-titlebar {
      display: grid;
      grid-template-columns: 78px 1fr minmax(138px, 248px);
      align-items: center;
      height: 22px;
      min-height: 22px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: #000000;
      line-height: 1;
    }

    .embedded .standalone-titlebar {
      display: none;
    }

    .standalone-window-controls {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 7px;
      border-right: 1px solid var(--line);
    }

    .standalone-window-control {
      width: 12px;
      height: 12px;
      min-height: 12px;
      padding: 0;
      border: 1px solid #000;
      border-radius: 50%;
      cursor: pointer;
    }

    .standalone-window-control.close {
      background: #ff5f57;
      border-color: #e0443e;
    }

    .standalone-window-control.home {
      background: #febc2e;
      border-color: #d89e24;
    }

    .standalone-window-control.expand {
      background: #28c840;
      border-color: #1eab33;
    }

    .standalone-app-title {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-right: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .standalone-file {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      padding: 0 8px;
      font-size: 11px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      max-width: 100%;
      min-width: 0;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0;
    }

    .top-recipients {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: none;
      margin-bottom: 14px;
      padding: 14px;
    }

    .top-recipient-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .top-recipient-row {
      display: grid;
      grid-template-columns: 42px minmax(180px, 1fr) 110px;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .top-recipient-check {
      display: grid;
      place-items: center;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .top-recipient-check input {
      width: 18px;
      min-height: 18px;
      accent-color: var(--accent);
    }

    .top-save-button.saved {
      background: #f2f2f2;
      border-color: var(--line);
      color: var(--text);
    }

    .top-save-button {
      white-space: nowrap;
      width: 100%;
    }

    main {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: none;
      overflow: hidden;
    }

    .tab-panel {
      padding: 22px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 0;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
    }

    .small-note {
      color: var(--muted);
      font-size: 12px;
      margin: -6px 0 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      min-width: 0;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      min-width: 0;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input[type="date"],
    input[type="number"],
    input[type="email"],
    input[type="text"] {
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="date"] {
      font-size: 16px;
      padding-left: 9px;
      padding-right: 4px;
    }

    input::-webkit-date-and-time-value {
      display: block;
      min-height: 1.2em;
      text-align: left;
      width: 100%;
    }

    input::-webkit-calendar-picker-indicator {
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-4 {
      grid-column: span 4;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    .button {
      border: 1px solid var(--line);
      border-radius: 8px;
      max-width: 100%;
      min-height: 44px;
      padding: 9px 15px;
      cursor: pointer;
      font-weight: 800;
      color: var(--text);
      background: #fff;
    }

    .button:hover {
      background: #f2f2f2;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .button.secondary {
      background: #fff;
      border-color: var(--line);
      color: var(--text);
    }

    .button.secondary:hover {
      background: #f2f2f2;
    }

    .button.danger {
      background: #fff;
      border-color: var(--line);
      color: var(--danger);
    }

    .button.danger:hover {
      background: #f2f2f2;
    }

    .message {
      min-height: 24px;
      color: var(--accent-strong);
      font-weight: 700;
    }

    .message.error {
      color: var(--danger);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 18px;
    }

    .history-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 18px;
      overflow: hidden;
    }

    .history-title {
      border-bottom: 1px solid var(--line);
      padding: 10px;
    }

    .day-history {
      padding: 10px;
    }

    .history-date-row {
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    .history-date-row label {
      min-width: 0;
    }

    .history-date-row input[type="date"] {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .history-list {
      display: grid;
      gap: 8px;
    }

    .history-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 10px;
    }

    .history-item {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      display: grid;
      gap: 4px;
      padding: 10px;
      text-align: left;
    }

    .history-item.selected-record {
      background: #f2f2f2;
      font-weight: 800;
    }

    .history-item-main {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 800;
      min-width: 0;
    }

    .history-item-sub {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      white-space: nowrap;
    }

    tbody tr {
      cursor: pointer;
    }

    tbody tr.selected-record td {
      background: #f2f2f2;
      font-weight: 700;
    }

    th {
      color: var(--text);
      background: #f2f2f2;
      font-size: 13px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty {
      padding: 26px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .check-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .check-item input {
      width: 18px;
      min-height: 18px;
      accent-color: var(--accent);
    }

    .preview {
      width: 100%;
      min-height: 220px;
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--text);
      background: #fff;
    }

    .analytics-panel {
      border-top: 1px solid var(--line);
    }

    .analytics-controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .mode-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .mode-button.active {
      background: #f2f2f2;
      border-width: 2px;
    }

    .analytics-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .analytics-table {
      min-width: 760px;
    }

    .chart-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      overflow: hidden;
    }

    .fuel-chart {
      display: block;
      width: 100%;
      height: auto;
      min-height: 220px;
    }

    .chart-label {
      fill: var(--text);
      font-size: 12px;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }

    .row-actions {
      display: flex;
      gap: 8px;
    }

    .small-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      min-height: 34px;
      padding: 5px 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .small-button:hover {
      background: #f2f2f2;
    }

    @media (max-width: 820px) {
      header {
        gap: 12px;
      }

      .form-grid,
      .check-list,
      .analytics-controls {
        grid-template-columns: 1fr;
      }

      .top-recipient-row {
        grid-template-columns: 38px minmax(0, 1fr) 96px;
        gap: 8px;
      }

      .span-2,
      .span-4 {
        grid-column: span 1;
      }

      .tab-panel {
        padding: 16px;
      }
    }

    @media (max-width: 480px) {
      .app {
        width: calc(100% - 16px);
        padding: 12px 0 28px;
      }

      header {
        margin-bottom: 10px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 18px;
      }

      .hint {
        font-size: 12px;
      }

      .top-recipients {
        padding: 10px;
        margin-bottom: 10px;
      }

      .section-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }

      .top-recipient-list {
        gap: 7px;
      }

      .top-recipient-row {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 6px;
      }

      .top-save-button {
        grid-column: 2;
        justify-self: stretch;
      }

      .top-recipient-check,
      input,
      textarea,
      .button {
        min-height: 46px;
      }

      input,
      textarea {
        border-radius: 7px;
        padding: 9px 8px;
        font-size: 16px;
      }

      input[type="date"] {
        padding-left: 6px;
        padding-right: 2px;
      }

      .top-save-button {
        min-height: 46px;
        padding: 8px 6px;
        font-size: 13px;
      }

      .tab-panel {
        padding: 12px;
      }

      .form-grid {
        gap: 10px;
      }

      label {
        font-size: 12px;
      }

      .actions {
        gap: 8px;
        margin-top: 12px;
      }

      .actions .button {
        flex: 1 1 100%;
      }

      .message {
        width: 100%;
        font-size: 13px;
      }

      .table-wrap {
        margin-top: 12px;
      }

      th,
      td {
        padding: 8px;
        font-size: 13px;
      }

      .preview {
        min-height: 180px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="standalone-titlebar">
    <div class="standalone-window-controls" aria-label="画面操作">
      <button class="standalone-window-control close" type="button" data-title-action="home" aria-label="起動画面へ戻る" title="起動画面へ戻る"></button>
      <button class="standalone-window-control home" type="button" data-title-action="home" aria-label="起動画面へ戻る" title="起動画面へ戻る"></button>
      <button class="standalone-window-control expand" type="button" data-title-action="reload" aria-label="再読み込み" title="再読み込み"></button>
    </div>
    <div class="standalone-app-title">上野清掃2.3 v2-3</div>
    <div class="standalone-file">index_nenpi_sousin.html</div>
  </header>
  <div class="app">
    <header>
      <div>
        <h1>燃費報告を送信</h1>
        <div class="hint">入力内容を登録し、送付先を選択してGmail作成画面を開きます。</div>
      </div>
    </header>

    <section class="top-recipients" aria-label="上部送付先リスト">
      <div class="section-title">
        <h2>送付先アドレス</h2>
        <div class="hint">チェックした保存済みアドレスへ送信します。</div>
      </div>
      <div class="top-recipient-list" id="topRecipientList"></div>
      <div class="actions">
        <span class="message" id="topRecipientMessage"></span>
      </div>
    </section>

    <main>
      <section class="tab-panel" id="entryPanel">
        <div class="section-title">
          <h2>燃費データ</h2>
        </div>
        <div class="small-note">保存ボタンで履歴に保存します。</div>

        <form id="fuelForm" autocomplete="on">
          <div class="form-grid">
            <label>給油日
              <input id="fuelDate" type="date" required>
            </label>
            <label>車番
              <input id="vehicleNo" type="text" inputmode="numeric" placeholder="例：1234" required>
            </label>
            <label>車種
              <input id="vehicleType" type="text" placeholder="例：軽トラック">
            </label>
            <label>運転者
              <input id="driver" type="text" placeholder="例：西山" required>
            </label>
            <label>オドメーター
              <input id="odometer" type="number" min="0" step="1" placeholder="例：123456">
            </label>
            <label>走行距離(km)
              <input id="distance" type="number" min="0" step="0.1" placeholder="空白でOKです">
            </label>
            <label>給油燃料量(L)
              <input id="fuelVolume" type="number" min="0" step="0.01" placeholder="例：23.4" required>
            </label>
            <label>燃費(km/L)
              <input id="fuelEconomy" type="number" min="0" step="0.01" placeholder="空白でOKです">
            </label>
            <label class="span-4">備考
              <textarea id="note" placeholder="必要があれば入力"></textarea>
            </label>
          </div>
          <div class="actions">
            <button class="button" type="submit" id="addFuelButton">履歴に保存</button>
            <button class="button secondary" type="button" id="clearFormButton">入力を消す</button>
            <span class="message" id="entryMessage"></span>
          </div>
        </form>

        <div id="recordsArea"></div>
      </section>

      <section class="tab-panel" id="sendPanel">
        <div class="section-title">
          <h2>送信</h2>
        </div>

        <label>送信本文プレビュー
          <textarea id="mailPreview" class="preview" readonly></textarea>
        </label>

        <div class="actions">
          <button class="button" type="button" id="sendButton">Gmailで送信</button>
          <button class="button danger" type="button" id="clearHistoryButton">履歴削除</button>
          <span class="message" id="sendMessage"></span>
        </div>
      </section>

      <section class="tab-panel analytics-panel" id="analyticsPanel">
        <div class="section-title">
          <h2>燃費確認</h2>
          <div class="hint">確認用です。メール送信には入りません。</div>
        </div>
        <div class="analytics-controls">
          <label>年
            <select id="analyticsYear"></select>
          </label>
          <label>月
            <select id="analyticsMonth"></select>
          </label>
          <label>車番・車種
            <select id="analyticsVehicle"></select>
          </label>
          <label>表示
            <select id="analyticsMode">
              <option value="list">燃費リスト</option>
              <option value="graph">燃費グラフ</option>
            </select>
          </label>
        </div>
        <div class="mode-buttons" aria-label="燃費表示切替">
          <button class="button mode-button active" type="button" data-analytics-mode="list">燃費リスト</button>
          <button class="button mode-button secondary" type="button" data-analytics-mode="graph">燃費グラフ</button>
        </div>
        <div id="analyticsOutput"></div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "fuel-report-mailer-v1";
    const subject = "[燃費報告]";

    const state = loadState();
    const fields = {
      fuelDate: document.getElementById("fuelDate"),
      vehicleNo: document.getElementById("vehicleNo"),
      vehicleType: document.getElementById("vehicleType"),
      driver: document.getElementById("driver"),
      odometer: document.getElementById("odometer"),
      distance: document.getElementById("distance"),
      fuelVolume: document.getElementById("fuelVolume"),
      fuelEconomy: document.getElementById("fuelEconomy"),
      note: document.getElementById("note")
    };

    const messages = {
      entry: document.getElementById("entryMessage"),
      send: document.getElementById("sendMessage"),
      topRecipient: document.getElementById("topRecipientMessage")
    };
    const analytics = {
      year: document.getElementById("analyticsYear"),
      month: document.getElementById("analyticsMonth"),
      vehicle: document.getElementById("analyticsVehicle"),
      mode: document.getElementById("analyticsMode"),
      output: document.getElementById("analyticsOutput")
    };

    document.querySelectorAll("[data-title-action]").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.titleAction === "reload") {
          location.reload();
          return;
        }
        location.href = "index.html";
      });
    });

    document.getElementById("fuelForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const record = readFuelForm();
      if (!record) return;
      state.records.push(record);
      state.selectedHistoryDate = record.fuelDate;
      state.selectedRecordId = record.id;
      saveState();
      resetFuelForm();
      setMessage(messages.entry, "履歴に保存しました。");
      render();
    });

    document.getElementById("clearFormButton").addEventListener("click", () => {
      resetFuelForm();
      setMessage(messages.entry, "入力を消しました。");
    });

    fields.vehicleNo.addEventListener("input", () => {
      fields.vehicleNo.value = normalizeVehicleNo(fields.vehicleNo.value);
      fillVehicleTypeFromHistory();
    });

    fields.fuelDate.addEventListener("change", () => {
      state.selectedHistoryDate = fields.fuelDate.value || todayLocalDate();
      state.selectedRecordId = "";
      saveState();
      render();
    });

    document.getElementById("topRecipientList").addEventListener("input", (event) => {
      const input = event.target.closest("[data-top-email]");
      if (!input) return;
      const item = findTopRecipient(input.dataset.topEmail);
      item.email = input.value.trim();
      item.saved = false;
      saveState();
      const row = input.closest(".top-recipient-row");
      const button = row.querySelector("[data-save-top-recipient]");
      button.textContent = "保存";
      button.classList.remove("saved");
    });

    document.getElementById("topRecipientList").addEventListener("change", (event) => {
      const checkbox = event.target.closest("[data-top-selected]");
      if (!checkbox) return;
      const item = findTopRecipient(checkbox.dataset.topSelected);
      item.selected = checkbox.checked;
      saveState();
    });

    document.getElementById("topRecipientList").addEventListener("click", (event) => {
      const button = event.target.closest("[data-save-top-recipient]");
      if (!button) return;
      const item = findTopRecipient(button.dataset.saveTopRecipient);
      if (!isValidEmail(item.email)) {
        setMessage(messages.topRecipient, "送付先アドレスを正しく入力してください。", true);
        return;
      }
      item.saved = true;
      item.selected = true;
      saveState();
      setMessage(messages.topRecipient, "保存しました。");
      render();
    });

    document.getElementById("sendButton").addEventListener("click", () => openGmailCompose());
    document.getElementById("clearHistoryButton").addEventListener("click", () => {
      if (!confirm("保存履歴を削除します。よろしいですか？")) return;
      state.records = [];
      state.selectedRecordId = "";
      state.selectedHistoryDate = "";
      saveState();
      setMessage(messages.send, "履歴を削除しました。");
      render();
    });

    document.getElementById("recordsArea").addEventListener("click", (event) => {
      const button = event.target.closest("[data-restore-record]");
      if (!button) return;
      restoreSelectedRecord();
    });

    [analytics.year, analytics.month, analytics.vehicle, analytics.mode].forEach((input) => {
      input.addEventListener("change", () => renderAnalytics());
    });

    document.querySelectorAll("[data-analytics-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        analytics.mode.value = button.dataset.analyticsMode;
        renderAnalytics();
      });
    });

    resetFuelForm();
    render();

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return {
          records: Array.isArray(saved?.records) ? saved.records : [],
          recipients: Array.isArray(saved?.recipients) ? saved.recipients : [],
          topRecipients: normalizeTopRecipients(saved?.topRecipients),
          selectedRecordId: saved?.selectedRecordId || "",
          selectedHistoryDate: saved?.selectedHistoryDate || todayLocalDate()
        };
      } catch {
        return {
          records: [],
          recipients: [],
          topRecipients: createTopRecipients(),
          selectedRecordId: "",
          selectedHistoryDate: todayLocalDate()
        };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function clearMessages() {
      Object.values(messages).forEach((message) => {
        message.textContent = "";
        message.classList.remove("error");
      });
    }

    function setMessage(element, text, isError = false) {
      element.textContent = text;
      element.classList.toggle("error", isError);
    }

    function readFuelForm() {
      const distance = numberOrBlank(fields.distance.value);
      const fuelVolume = numberOrBlank(fields.fuelVolume.value);
      const economy = numberOrBlank(fields.fuelEconomy.value);

      if (!fields.fuelDate.value || !fields.vehicleNo.value.trim() || !fields.driver.value.trim()) {
        setMessage(messages.entry, "給油日、車番、運転者を入力してください。", true);
        return null;
      }

      if (fuelVolume === "") {
        setMessage(messages.entry, "給油燃料量を入力してください。", true);
        return null;
      }

      return {
        id: crypto.randomUUID(),
        fuelDate: fields.fuelDate.value,
        vehicleNo: normalizeVehicleNo(fields.vehicleNo.value),
        vehicleType: fields.vehicleType.value.trim(),
        driver: fields.driver.value.trim(),
        odometer: numberOrBlank(fields.odometer.value),
        distance,
        fuelVolume,
        fuelEconomy: economy,
        note: fields.note.value.trim()
      };
    }

    function resetFuelForm() {
      document.getElementById("fuelForm").reset();
      fields.fuelDate.value = todayLocalDate();
      fields.fuelEconomy.value = "";
    }

    function todayLocalDate() {
      const date = new Date();
      date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
      return date.toISOString().slice(0, 10);
    }

    function numberOrBlank(value) {
      if (value === "" || value === null || value === undefined) return "";
      const number = Number(value);
      return Number.isFinite(number) ? number : "";
    }

    function normalizeVehicleNo(value) {
      return String(value ?? "").replace(/-/g, "").trim();
    }

    function fillVehicleTypeFromHistory() {
      const vehicleNo = normalizeVehicleNo(fields.vehicleNo.value);
      if (!vehicleNo || fields.vehicleType.value.trim()) return;
      const record = [...state.records].reverse().find((item) => {
        return normalizeVehicleNo(item.vehicleNo) === vehicleNo && item.vehicleType;
      });
      if (record) {
        fields.vehicleType.value = record.vehicleType;
      }
    }

    function recordsForDate(dateText) {
      return state.records.filter((record) => record.fuelDate === dateText);
    }

    function render() {
      renderTopRecipients();
      renderRecords();
      renderAnalytics();
      document.getElementById("mailPreview").value = buildMailBody();
    }

    function createTopRecipients() {
      return Array.from({ length: 5 }, (_, index) => ({
        id: `top-${index + 1}`,
        email: "",
        selected: false,
        saved: false
      }));
    }

    function normalizeTopRecipients(items) {
      const base = createTopRecipients();
      if (!Array.isArray(items)) return base;
      items.slice(0, 5).forEach((item, index) => {
        base[index] = {
          id: base[index].id,
          email: item?.email || "",
          selected: Boolean(item?.selected),
          saved: Boolean(item?.saved)
        };
      });
      return base;
    }

    function findTopRecipient(id) {
      let item = state.topRecipients.find((recipient) => recipient.id === id);
      if (!item) {
        item = createTopRecipients()[0];
        state.topRecipients.push(item);
      }
      return item;
    }

    function renderTopRecipients() {
      const area = document.getElementById("topRecipientList");
      area.innerHTML = state.topRecipients.map((recipient, index) => `
        <div class="top-recipient-row">
          <label class="top-recipient-check" aria-label="送付先${index + 1}を選択">
            <input type="checkbox" data-top-selected="${recipient.id}" ${recipient.selected ? "checked" : ""}>
          </label>
          <input type="email" data-top-email="${recipient.id}" value="${escapeHtml(recipient.email)}" placeholder="送付先アドレス ${index + 1}">
          <button class="button secondary top-save-button ${recipient.saved ? "saved" : ""}" type="button" data-save-top-recipient="${recipient.id}">
            ${recipient.saved ? "保存済み" : "保存"}
          </button>
        </div>
      `).join("");
    }

    function renderRecords() {
      const area = document.getElementById("recordsArea");
      area.innerHTML = `
        <div class="history-wrap">
          <h2 class="history-title">保存履歴</h2>
          <div class="history-date-row">
            <label>履歴日
              <input id="historyDate" type="date" value="${escapeHtml(state.selectedHistoryDate || fields.fuelDate.value || todayLocalDate())}">
            </label>
          </div>
          ${buildSelectedDateHistoryHtml()}
        </div>
      `;

      area.querySelectorAll("[data-delete-record]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          if (state.selectedRecordId === button.dataset.deleteRecord) {
            state.selectedRecordId = "";
          }
          state.records = state.records.filter((record) => record.id !== button.dataset.deleteRecord);
          saveState();
          render();
        });
      });

      area.querySelectorAll("[data-preview-record]").forEach((row) => {
        row.addEventListener("click", () => {
          state.selectedRecordId = row.dataset.previewRecord;
          saveState();
          render();
        });
      });

      const historyDate = document.getElementById("historyDate");
      historyDate.addEventListener("change", () => {
        state.selectedHistoryDate = historyDate.value || todayLocalDate();
        state.selectedRecordId = "";
        saveState();
        render();
      });

    }

    function buildSelectedDateHistoryHtml() {
      if (state.records.length === 0) {
        return `<div class="day-history"><div class="empty">保存履歴はまだありません。</div></div>`;
      }

      const selectedDate = state.selectedHistoryDate || fields.fuelDate.value || todayLocalDate();
      const dayRecords = recordsForDate(selectedDate);
      if (dayRecords.length === 0) {
        return `<div class="day-history"><div class="small-note">${escapeHtml(selectedDate)} の履歴はありません。</div></div>`;
      }

      return `
        <div class="day-history">
          <div class="small-note">${escapeHtml(selectedDate)} の履歴</div>
          <div class="history-list">
            ${dayRecords.map((record) => `
              <button class="history-item ${state.selectedRecordId === record.id ? "selected-record" : ""}" type="button" data-preview-record="${record.id}">
                <span class="history-item-main">
                  <span>${escapeHtml(record.vehicleNo || "車番なし")} ${escapeHtml(record.vehicleType || "")}</span>
                  <span>${formatValue(record.fuelVolume)}L</span>
                </span>
                <span class="history-item-sub">運転者：${escapeHtml(record.driver || "")} / オドメーター：${formatValue(record.odometer)}</span>
                <span class="history-item-sub">走行距離：${formatValue(record.distance)} / 燃費：${formatValue(record.fuelEconomy)} / 備考：${escapeHtml(record.note || "")}</span>
                <span><span class="small-button" data-delete-record="${record.id}">削除</span></span>
              </button>
            `).join("")}
          </div>
          <div class="history-actions">
            <button class="button secondary" type="button" data-restore-record ${state.selectedRecordId ? "" : "disabled"}>
              選択履歴を入力欄に戻す
            </button>
          </div>
        </div>
      `;
    }

    function restoreSelectedRecord() {
      const record = selectedRecord();
      if (!record) {
        setMessage(messages.entry, "復元する履歴をクリックしてください。", true);
        return;
      }

      fields.fuelDate.value = record.fuelDate || todayLocalDate();
      fields.vehicleNo.value = record.vehicleNo || "";
      fields.vehicleType.value = record.vehicleType || "";
      fields.driver.value = record.driver || "";
      fields.odometer.value = formatValue(record.odometer);
      fields.distance.value = formatValue(record.distance);
      fields.fuelVolume.value = formatValue(record.fuelVolume);
      fields.fuelEconomy.value = formatValue(record.fuelEconomy);
      fields.note.value = record.note || "";

      state.records = state.records.filter((item) => item.id !== record.id);
      state.selectedHistoryDate = fields.fuelDate.value || todayLocalDate();
      state.selectedRecordId = "";
      saveState();
      setMessage(messages.entry, "履歴を入力欄に戻しました。訂正後に履歴に保存してください。");
      render();
      fields.vehicleNo.focus();
    }

    function renderAnalytics() {
      const selected = {
        year: analytics.year.value,
        month: analytics.month.value,
        vehicle: analytics.vehicle.value,
        mode: analytics.mode.value || "list"
      };
      const rows = calculatedFuelRows();
      renderAnalyticsOptions(rows, selected);
      const filtered = filterFuelRows(rows);
      document.querySelectorAll("[data-analytics-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.analyticsMode === analytics.mode.value);
        button.classList.toggle("secondary", button.dataset.analyticsMode !== analytics.mode.value);
      });
      analytics.output.innerHTML = analytics.mode.value === "graph"
        ? fuelGraphHtml(filtered)
        : fuelListHtml(filtered);
    }

    function renderAnalyticsOptions(rows, selected) {
      const years = [...new Set(rows.map((row) => dateParts(row.fuelDate).year).filter(Boolean))].sort();
      const vehicles = new Map();
      rows.forEach((row) => {
        if (!row.vehicleNo || vehicles.has(row.vehicleNo)) return;
        vehicles.set(row.vehicleNo, [row.vehicleNo, row.vehicleType].filter(Boolean).join(" / "));
      });

      analytics.year.innerHTML = `<option value="">すべて</option>${years.map((year) => (
        `<option value="${escapeHtml(year)}">${escapeHtml(year)}年</option>`
      )).join("")}`;
      analytics.month.innerHTML = `<option value="">すべて</option>${Array.from({ length: 12 }, (_, index) => {
        const month = String(index + 1);
        return `<option value="${month}">${month}月</option>`;
      }).join("")}`;
      analytics.vehicle.innerHTML = `<option value="">すべて</option>${[...vehicles].map(([vehicle, label]) => (
        `<option value="${escapeHtml(vehicle)}">${escapeHtml(label)}</option>`
      )).join("")}`;
      analytics.year.value = years.includes(selected.year) ? selected.year : "";
      analytics.month.value = selected.month || "";
      analytics.vehicle.value = vehicles.has(selected.vehicle) ? selected.vehicle : "";
      analytics.mode.value = selected.mode === "graph" ? "graph" : "list";
    }

    function calculatedFuelRows() {
      const previousByVehicle = new Map();
      return [...state.records]
        .map((record, index) => ({ record, index }))
        .sort((a, b) => {
          const dateCompare = String(a.record.fuelDate || "").localeCompare(String(b.record.fuelDate || ""));
          return dateCompare || a.index - b.index;
        })
        .map(({ record }) => {
          const vehicleNo = normalizeVehicleNo(record.vehicleNo);
          const odometer = numberOrBlank(record.odometer);
          const fuelVolume = numberOrBlank(record.fuelVolume);
          let distance = numberOrBlank(record.distance);
          let fuelEconomy = numberOrBlank(record.fuelEconomy);
          const previousOdometer = previousByVehicle.get(vehicleNo);

          if (distance === "" && odometer !== "" && previousOdometer !== undefined) {
            distance = round1(odometer - previousOdometer);
          }
          if (fuelEconomy === "" && distance !== "" && fuelVolume) {
            fuelEconomy = round1(distance / fuelVolume);
          }
          if (vehicleNo && odometer !== "") {
            previousByVehicle.set(vehicleNo, odometer);
          }
          return { ...record, vehicleNo, distance, fuelVolume, fuelEconomy };
        });
    }

    function filterFuelRows(rows) {
      return rows.filter((row) => {
        const parts = dateParts(row.fuelDate);
        return (!analytics.year.value || parts.year === analytics.year.value)
          && (!analytics.month.value || parts.month === analytics.month.value)
          && (!analytics.vehicle.value || row.vehicleNo === analytics.vehicle.value);
      });
    }

    function fuelListHtml(rows) {
      if (rows.length === 0) {
        return `<div class="empty">指定期間の燃費履歴はありません。</div>`;
      }
      return `
        <div class="analytics-table-wrap">
          <table class="analytics-table">
            <thead>
              <tr>
                <th>給油日</th>
                <th>車番</th>
                <th>車種</th>
                <th>オドメーター</th>
                <th>走行距離</th>
                <th>給油量</th>
                <th>燃費</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  <td>${escapeHtml(row.fuelDate)}</td>
                  <td>${escapeHtml(row.vehicleNo)}</td>
                  <td>${escapeHtml(row.vehicleType)}</td>
                  <td>${escapeHtml(formatValue(row.odometer))}</td>
                  <td>${escapeHtml(formatValue(row.distance))}</td>
                  <td>${escapeHtml(formatValue(row.fuelVolume))}</td>
                  <td>${escapeHtml(formatValue(row.fuelEconomy))}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function fuelGraphHtml(rows) {
      const points = rows.filter((row) => numberOrBlank(row.fuelEconomy) !== "");
      if (points.length === 0) {
        return `<div class="empty">グラフにできる燃費履歴はありません。</div>`;
      }

      const width = 720;
      const height = 260;
      const pad = { left: 46, right: 16, top: 18, bottom: 42 };
      const values = points.map((row) => Number(row.fuelEconomy));
      const min = Math.max(0, Math.min(...values) - 1);
      const max = Math.max(...values) + 1;
      const xStep = points.length === 1 ? 0 : (width - pad.left - pad.right) / (points.length - 1);
      const yFor = (value) => pad.top + (max - value) / (max - min || 1) * (height - pad.top - pad.bottom);
      const coords = points.map((row, index) => ({
        x: pad.left + xStep * index,
        y: yFor(Number(row.fuelEconomy)),
        row
      }));
      const polyline = coords.map((point) => `${point.x},${point.y}`).join(" ");

      return `
        <div class="chart-box">
          <svg class="fuel-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="燃費グラフ">
            <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}" stroke="#000" stroke-width="1"></line>
            <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#000" stroke-width="1"></line>
            <text class="chart-label" x="8" y="${pad.top + 8}">${escapeHtml(max.toFixed(1))}</text>
            <text class="chart-label" x="8" y="${height - pad.bottom}">${escapeHtml(min.toFixed(1))}</text>
            ${coords.length > 1 ? `<polyline points="${polyline}" fill="none" stroke="#000" stroke-width="3"></polyline>` : ""}
            ${coords.map((point, index) => `
              <circle cx="${point.x}" cy="${point.y}" r="5" fill="#fff" stroke="#000" stroke-width="2"></circle>
              <text class="chart-label" x="${point.x - 14}" y="${point.y - 10}">${escapeHtml(formatValue(point.row.fuelEconomy))}</text>
              <text class="chart-label" x="${Math.max(4, point.x - 34)}" y="${height - 16}">${escapeHtml(shortDate(point.row.fuelDate))}</text>
            `).join("")}
          </svg>
        </div>
      `;
    }

    function selectedEmails() {
      const topEmails = state.topRecipients
        .filter((recipient) => recipient.saved && recipient.selected && recipient.email)
        .map((recipient) => recipient.email);
      return [...new Set(topEmails)];
    }

    function validateBeforeSend() {
      if (!selectedRecord()) {
        setMessage(messages.send, "送信する履歴を1件クリックしてください。", true);
        return false;
      }
      if (selectedEmails().length === 0) {
        setMessage(messages.send, "送付先を選択してください。", true);
        return false;
      }
      return true;
    }

    function openGmailCompose() {
      if (!validateBeforeSend()) return;
      const to = selectedEmails().join(",");
      const subjectEncoded = encodeURIComponent(subject);
      const bodyEncoded = encodeURIComponent(buildMailBody());
      openMailComposer(`mailto:${to}?subject=${subjectEncoded}&body=${bodyEncoded}`);
    }

    function openMailComposer(mailtoUrl) {
      const a = document.createElement("a");
      a.href = mailtoUrl;
      a.target = "_top";
      a.rel = "noopener";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 1000);
    }

    function buildMailBody() {
      const record = selectedRecord();
      if (!record) {
        return "履歴をクリックすると、ここに1件だけ表示します。";
      }

      const lines = ["【燃費報告】"];
      lines.push("");
      lines.push(`給油日：${record.fuelDate || ""}`);
      lines.push(`車番：${record.vehicleNo || ""}`);
      lines.push(`車種：${record.vehicleType || ""}`);
      lines.push(`運転者：${record.driver || ""}`);
      lines.push(`オドメーター：${formatValue(record.odometer)}`);
      lines.push(`走行距離(km)：${formatValue(record.distance)}`);
      lines.push(`給油燃料量(L)：${formatValue(record.fuelVolume)}`);
      lines.push(`燃費(km/L)：${formatValue(record.fuelEconomy)}`);
      lines.push(`備考：${record.note || ""}`);
      return lines.join("\n");
    }

    function selectedRecord() {
      return state.records.find((record) => record.id === state.selectedRecordId) || null;
    }

    function formatValue(value) {
      return value === "" || value === null || value === undefined ? "" : String(value);
    }

    function dateParts(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{1,2})-/);
      return {
        year: match ? match[1] : "",
        month: match ? String(Number(match[2])) : ""
      };
    }

    function shortDate(value) {
      const match = String(value || "").match(/^\d{4}-(\d{1,2})-(\d{1,2})/);
      return match ? `${Number(match[1])}/${Number(match[2])}` : String(value || "");
    }

    function round1(value) {
      return Math.round(Number(value) * 10) / 10;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }
  </script>
</body>
</html>
