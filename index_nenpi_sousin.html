<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>燃費報告</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>燃費報告</h1>
      <p id="workbookPath">Excelを読み込み中</p>
    </div>
    <button class="menu-button" id="reloadButton" type="button">再読込</button>
  </header>

  <main class="app-main">
    <input id="metaDriver" type="hidden">
    <input id="metaDriver1" type="hidden">
    <input id="metaDriver2" type="hidden">
    <input id="metaDriver3" type="hidden">
    <input id="metaDriver4" type="hidden">
    <input id="metaDriver5" type="hidden">

    <details class="register-drawer">
      <summary><span>^ 登録</span></summary>
      <section class="register-panel">
        <div class="register-group vehicle-register">
          <div class="group-title">車両登録</div>
          <label>
            <span>車番</span>
            <input id="registerVehicle" type="text">
          </label>
          <label>
            <span>車種</span>
            <input id="registerVehicleType" type="text">
          </label>
          <button class="register-button" id="registerVehicleButton" type="button">車両保存</button>
          <span class="register-info" id="vehicleSlotInfo"></span>
        </div>

        <div class="register-group driver-register">
          <div class="group-title">運転者登録</div>
          <label>
            <span>運転者</span>
            <input id="registerDriver" type="text">
          </label>
          <button class="register-button" id="registerDriverButton" type="button">運転者保存</button>
          <span class="register-info" id="driverSlotInfo"></span>
        </div>
        <div class="register-group workbook-register">
          <div class="group-title">Excel選択</div>
          <label>
            <span>Excel</span>
            <select id="fileSelect"></select>
          </label>
          <label>
            <span>Sheet</span>
            <select id="sheetSelect"></select>
          </label>
        </div>
      </section>
    </details>

    <section class="select-panel">
      <label>
        <span>登録車番</span>
        <select id="metaSelectedVehicle"></select>
      </label>
      <label>
        <span>車種</span>
        <input id="metaActiveVehicleType" type="text" readonly>
      </label>
      <label>
        <span>登録運転者</span>
        <select id="metaSelectedDriver"></select>
      </label>
      <label>
        <span>年</span>
        <select id="yearFilter"></select>
      </label>
      <label>
        <span>月</span>
        <select id="monthFilter"></select>
      </label>
      <select id="startupVehicleSelect" hidden></select>
      <select id="vehicleFilter" hidden></select>
    </section>

    <section class="summary-strip">
      <span id="recordCount">0件</span>
      <span id="selectedInfo">未選択</span>
      <button class="save-button" id="saveSheet" type="button" hidden>保存</button>
    </section>

    <section class="table-panel">
      <div class="table-wrap">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
