<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>列選択ビューア</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { overscroll-behavior-x: contain; margin:0; font-family:'Hiragino Sans','ヒラギノ角ゴ ProN','Meiryo','メイリオ',sans-serif; font-size:13px; font-weight:400; }

  #app-header {
    padding:10px 16px;
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:120;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    min-height:44px;
  }
  #app-header h1 { margin:0; font-size:15px; font-weight:700; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #header-actions {
    display:flex; align-items:center; gap:10px; flex:0 1 auto; min-width:0;
    max-width:72%; overflow-x:auto; overflow-y:hidden;
    overscroll-behavior-x:contain; touch-action:pan-x;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  #header-actions::-webkit-scrollbar { display:none; }
  #header-actions > button { flex:0 0 auto; }
  #backBtn {
    padding:5px 14px; background:rgba(255,255,255,0.2);
    border:1px solid rgba(255,255,255,0.5); border-radius:4px;
    color:#fff; font-size:12px; cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  #backBtn:hover { background:rgba(255,255,255,0.35); }
  #fileNameDisplay { font-size:10px; opacity:0.8; line-height:1.3; text-align:right; flex-shrink:0; max-width:38%; overflow:hidden; }

  #toolbar {
    border-bottom:1px solid #b5cef5;
    position:sticky; top:44px; z-index:119;
  }
  #toolbar-inner {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:7px 14px;
    overflow-y:auto; max-height:60vh;
    transition: max-height 0.22s ease, padding 0.22s ease;
  }
  #toolbar.collapsed #toolbar-inner {
    display:none;
  }
  #toolbar-toggle {
    flex:0 0 auto; padding:5px 10px;
    border:1px solid #222; border-radius:4px;
    cursor:pointer; font-size:12px; color:#000; background:#fff;
    font-family:inherit; transition:background 0.15s;
  }
  #toolbar-toggle:active { background:#bdd6f5; }
  #btnScreenshot {
    flex:0 0 auto; padding:5px 10px;
    border:1px solid #222; border-radius:4px;
    cursor:pointer; font-size:12px; color:#000; background:#fff;
    font-family:inherit; white-space:nowrap;
  }
  #btnScreenshot:active { background:#bdd6f5; }
  .tb-btn {
    padding:4px 10px; border:1px solid #a0b8d8; border-radius:4px;
    cursor:pointer; font-size:11px; font-family:inherit; white-space:nowrap;
  }
  .tb-btn:hover { background:#d4e5f9; }
  .toolbar-search { position:relative; width:150px; flex:0 0 150px; }
  #searchInput {
    box-sizing:border-box; width:100%; padding:4px 30px 4px 8px;
    border:1px solid #a0b8d8; border-radius:4px;
    font-size:12px; font-family:inherit;
  }
  #searchClear {
    position:absolute; top:50%; right:3px; transform:translateY(-50%);
    width:24px; height:24px; padding:0; border:0; background:transparent;
    color:#222; font-size:19px; line-height:24px; font-family:inherit;
    font-weight:700; cursor:pointer;
  }
  #searchInput:placeholder-shown + #searchClear { display:none; }
  #gitFileSelector {
    padding:4px 8px; border:1px solid #a0b8d8; border-radius:4px;
    font-size:12px; max-width:190px;
  }
  #sheetSelector {
    padding:4px 8px; border:1px solid #a0b8d8; border-radius:4px;
    font-size:12px; max-width:150px;
  }
  #sheetSelector:disabled { color: #aaa; }
  #statusBar { font-size:11px; color:#555; }

  /* 担当者・曜日選択 */
  #assignmentDialog {
    display:none; position:fixed; inset:0; z-index:520;
    padding:24px; background:rgba(0,0,0,0.35);
    align-items:center; justify-content:center;
  }
  #assignmentDialog.active { display:flex; }

  /* ===== 画面を開くときのスライド（他の画面切り替えと同じ1秒） ===== */
  @keyframes colviewPanelIn {
    from { transform: translate3d(100%, 0, 0); opacity: 0.35; }
    to   { transform: translate3d(0, 0, 0); opacity: 1; }
  }
  @keyframes colviewBackdropIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #assignmentDialog.active,
  #newRecordDialog.active,
  #saveDialog.active { animation: colviewBackdropIn 1000ms ease; }
  #assignmentDialog.active > #assignmentPanel,
  #newRecordDialog.active > #newRecordPanel,
  #saveDialog.active > #saveDialogBox {
    animation: colviewPanelIn 1000ms cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
  }
  @media (prefers-reduced-motion: reduce) {
    #assignmentDialog.active, #newRecordDialog.active, #saveDialog.active,
    #assignmentDialog.active > #assignmentPanel,
    #newRecordDialog.active > #newRecordPanel,
    #saveDialog.active > #saveDialogBox { animation: none; }
  }
  #assignmentPanel {
    width:min(680px, 100%); max-height:calc(100vh - 48px); overflow-y:auto;
    padding:20px; border:1px solid #222; border-radius:6px;
    box-shadow:0 8px 28px rgba(0,0,0,0.28); background:#fff;
  }
  .assignment-screen-title { margin:0 0 18px; font-size:19px; color:#111; }
  .assignment-screen-body { display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:start; }
  .assignment-group-title { margin-bottom:7px; font-size:13px; font-weight:700; color:#1a6eb5; }
  .assignment-options { display:flex; flex-wrap:wrap; gap:7px 10px; }
  .assignment-option { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; cursor:pointer; }
  .assignment-option input { width:16px; height:16px; margin:0; cursor:pointer; accent-color:#1a6eb5; }
  .assignment-add-row { display:flex; gap:6px; margin-top:10px; }
  .assignment-add-row input { min-width:0; width:120px; padding:6px 8px; border:1px solid #777; background:#fff; color:#111; font:inherit; }
  .assignment-add-row button { padding:6px 10px; border:1px solid #222; background:#fff; color:#111; font:inherit; font-weight:700; cursor:pointer; }
  .assignment-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }
  .assignment-actions button {
    padding:7px 13px; border:1px solid #a0b8d8; border-radius:4px;
    background:#fff; color:#000; font-family:inherit; font-size:12px; font-weight:700;
    cursor:pointer; white-space:nowrap;
  }
  #assignmentApply { border-color:#1a6eb5; }
  #assignmentCount { font-weight:700; }

  .collection-order-input {
    width:64px; padding:5px 6px; border:1px solid #777; border-radius:4px;
    background:#fff; color:#111; font:inherit; text-align:center;
  }
  .collection-order-input[data-registered="true"] { background:#d9d9d9 !important; }
  .collection-order-input:focus { outline:2px solid #222; outline-offset:1px; }
  .collection-order-editor { display:flex; align-items:center; gap:5px; }
  .collection-order-change {
    padding:5px 8px; border:1px solid #222; border-radius:4px;
    background:#fff; color:#111; font:inherit; font-weight:700; cursor:pointer;
    white-space:nowrap;
  }
  .collection-order-change:active { font-weight:900; }
  /* 登録済みは収集順の入力欄と同じグレーにする */
  .collection-order-change.registered { background:#d9d9d9 !important; }
  /* 地点登録ボタン */
  .geo-register-btn {
    padding:5px 8px; border:1px solid #222; border-radius:4px;
    background:#fff; color:#111; font:inherit; font-weight:700; cursor:pointer;
    white-space:nowrap;
  }
  .geo-register-btn:active { font-weight:900; }
  .geo-register-btn.registered { background:#d9d9d9 !important; }
  /* 計量物件だけに出る、計量データ入力（3-20）を開くボタン */
  .keiryou-open-btn {
    padding:5px 8px; border:1px solid #14558f; border-radius:4px;
    background:#1a6eb5; color:#fff; font:inherit; font-weight:700; cursor:pointer;
    white-space:nowrap;
  }
  .keiryou-open-btn:active { background:#14558f; }
  /* 計量済みは収集順の入力欄と同じグレーにする */
  .keiryou-open-btn.registered {
    background:#d9d9d9 !important; color:#111 !important; border-color:#222;
  }
  /* 表の直後に置く（画面に固定しない）。表が短いときは表のすぐ下、
     長いときは表が上限いっぱいになるので結果的に画面の一番下に来る。 */
  #collectionOrderActions {
    display:none; position:relative; z-index:170;
    padding:9px 14px; border-top:1px solid #222; background:#fff;
    box-shadow:0 -3px 12px rgba(0,0,0,.16); gap:8px; justify-content:flex-start;
    /* 2段にはせず1行のまま。入りきらない分は横スクロールで見る */
    flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
    min-width:0; max-width:100%; box-sizing:border-box; touch-action:pan-x pan-y pinch-zoom;
    scrollbar-width:none;
  }
  #collectionOrderActions::-webkit-scrollbar { display:none; }
  #collectionOrderActions.active { display:flex; }
  #collectionOrderActions button {
    padding:8px 12px; border:1px solid #222; border-radius:4px;
    background:#fff; color:#111; font:inherit; font-weight:700; cursor:pointer;
    flex:0 0 auto; white-space:nowrap;
  }
  #collectionOrderActions button:active { font-weight:900; }

  @media (max-width: 620px) {
    #assignmentDialog { padding:12px; align-items:flex-start; }
    #assignmentPanel { margin-top:8vh; padding:18px 16px; max-height:calc(92vh - 24px); }
    .assignment-screen-body { grid-template-columns:1fr; gap:18px; }
    .assignment-options { gap:12px 18px; }
    .assignment-option { min-height:32px; }
    .assignment-option input { width:20px; height:20px; }
    .assignment-actions button { flex:1; padding:10px 13px; }
    #collectionOrderActions { overflow-x:auto; justify-content:flex-start; }
    #collectionOrderActions button { flex:0 0 auto; min-height:42px; }
    .collection-order-input { width:58px; min-height:38px; font-size:16px; }
  }

  /* 列チェックボックスパネル */
  #colPanel {
    border-bottom:1px solid #b5cef5;
    padding:8px 14px; display:none; flex-wrap:wrap; gap:6px; align-items:center;
    position:sticky; top:88px; z-index:118;
    max-height:160px; overflow-y:auto;
  }
  #colPanel.active { display:flex; animation: colviewPanelDown 1000ms cubic-bezier(0.22, 0.61, 0.36, 1); }
  @keyframes colviewPanelDown {
    from { transform: translate3d(0, -100%, 0); opacity: 0.35; }
    to   { transform: translate3d(0, 0, 0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { #colPanel.active { animation: none; } }
  .col-lbl {
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 9px; border:1px solid #b5cef5; border-radius:12px;
    cursor:pointer; font-size:11px; white-space:nowrap; user-select:none;
  }
  .col-lbl:hover { background:#d4e5f9; }
  .col-lbl input { cursor:pointer; margin:0; }
  .col-lbl.on { background:#1a6eb5; color:#fff; border-color:#1558a0; }
  #btnNewRecord {
    padding:4px 11px; border:1px solid #222; border-radius:4px;
    background:#fff; color:#111; font-family:inherit; font-size:11px; font-weight:700; cursor:pointer;
  }
  #saturdayAddDialog {
    display:none; position:fixed; inset:0; z-index:460;
    background:rgba(255,255,255,.96); align-items:center; justify-content:center;
    padding:18px;
  }
  #saturdayAddDialog.active { display:flex; }
  #saturdayAddPanel {
    width:min(520px,100%); max-height:calc(100dvh - 36px); box-sizing:border-box;
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    border:2px solid #111; background:#fff; padding:16px;
  }
  #saturdayAddPanel h2 { margin:0 0 14px; font-size:20px; }
  .saturday-add-field { display:grid; gap:5px; margin:10px 0; font-weight:700; }
  .saturday-add-field select,
  .saturday-add-field input {
    width:100%; box-sizing:border-box; border:2px solid #111; background:#fff;
    padding:10px; font:inherit;
  }
  .saturday-add-group { border:2px solid #111; margin:10px 0; }
  #saturdayAddGroupToggle {
    display:flex; align-items:center; gap:10px; width:100%; border:0; background:#fff;
    padding:10px; font:inherit; font-weight:700; text-align:left;
  }
  #saturdayAddGroupToggle .value { margin-left:auto; font-weight:400; }
  #saturdayAddGroupToggle .arrow { width:18px; text-align:center; }
  .saturday-add-group.open #saturdayAddGroupToggle .arrow { transform:rotate(180deg); }
  #saturdayAddGroupBody { display:none; border-top:1px solid #999; padding:10px; }
  .saturday-add-group.open #saturdayAddGroupBody { display:block; }
  #saturdayAddGroupChoices { display:flex; flex-wrap:wrap; gap:8px; }
  #saturdayAddGroupChoices button {
    border:2px solid #111; background:#fff; padding:8px 12px; font-weight:700;
  }
  #saturdayAddGroupChoices button.selected { background:#ddd; }
  #saturdayAddExistingList { margin-top:10px; border-top:1px solid #999; }
  .saturday-existing-row {
    display:grid; grid-template-columns:42px minmax(70px,.7fr) minmax(130px,1.5fr);
    gap:8px; padding:7px 4px; border-bottom:1px solid #bbb; align-items:start;
    cursor:pointer;
  }
  .saturday-existing-row.selected { outline:2px solid #111; outline-offset:-2px; background:#ddd; }
  .saturday-existing-actions { display:flex; gap:8px; margin-top:10px; }
  .saturday-existing-actions button { border:2px solid #111; background:#fff; padding:8px 12px; font-weight:700; }
  #saturdayHiddenList { display:none; margin-top:10px; border-top:1px solid #999; }
  #saturdayHiddenList.open { display:block; }
  .saturday-hidden-row {
    display:grid; grid-template-columns:72px 42px minmax(70px,.7fr) minmax(130px,1.5fr);
    gap:8px; padding:8px 4px; border-bottom:1px solid #bbb; cursor:pointer;
  }
  .saturday-hidden-row:hover { background:#ddd; }
  .saturday-add-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .saturday-add-actions button { border:2px solid #111; background:#fff; padding:9px 16px; font-weight:700; }
  #btnAssignment { font-weight:700; }

  /* 新規登録 */
  #newRecordDialog {
    display:none; position:fixed; inset:0; z-index:320; padding:14px;
    background:rgba(0,0,0,.38); align-items:center; justify-content:center;
  }
  #newRecordDialog.active { display:flex; }
  #newRecordPanel {
    width:min(920px,100%); max-height:calc(100vh - 28px); overflow:auto;
    background:#fff; border:1px solid #222; border-radius:6px; padding:16px;
  }
  .new-record-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .new-record-head h2 { margin:0; font-size:18px; flex:1; }
  #newRecordClose { padding:7px 11px; border:1px solid #222; background:#fff; color:#111; font:inherit; font-weight:700; cursor:pointer; }
  #newRecordFields { border-top:1px solid #999; }
  .new-record-field { border-bottom:1px solid #999; min-width:0; }
  .new-record-field-title {
    display:flex; align-items:center; gap:8px; width:100%; padding:11px 4px;
    border:0 !important; border-radius:0 !important; box-shadow:none !important;
    background:#fff; color:#111; font:inherit; font-weight:700; text-align:left; cursor:pointer;
  }
  .new-record-field-title::after { content:'▼'; margin-left:auto; font-size:10px; }
  .new-record-field.open .new-record-field-title::after { content:'▲'; }
  .new-record-field-value { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#555; font-weight:400; }
  .new-record-field-body { display:none; padding:0 4px 11px; }
  .new-record-field.open .new-record-field-body { display:block; }
  .new-record-field input[type="text"], .new-record-field input[type="number"] {
    width:100%; min-height:38px; padding:6px 8px; border:1px solid #777;
    background:#fff; color:#111; font:inherit;
  }
  .new-record-choice-list { display:flex; flex-wrap:wrap; gap:5px; max-height:110px; overflow:auto; }
  .new-record-choice-list.weekday-choice-list { max-height:none; overflow:visible; }
  .new-record-choice {
    padding:5px 8px; border:1px solid #888; border-radius:4px;
    background:#fff; color:#111; font:inherit; cursor:pointer;
  }
  .new-record-choice.selected { background:#d9d9d9; font-weight:800; border-color:#222; }
  .new-record-order-row { display:flex; gap:6px; align-items:center; }
  .new-record-order-row input { flex:1; }
  .new-record-order-row button { min-height:38px; border:1px solid #222; background:#fff; font-weight:700; }
  .new-record-field-change { width:100%; min-height:38px; margin-top:7px; border:1px solid #222; background:#fff; font:inherit; font-weight:700; }
  #newRecordExisting { margin-top:8px; max-height:180px; overflow:auto; border:1px solid #aaa; }
  .new-record-existing-row { display:grid; grid-template-columns:48px 1fr; gap:8px; padding:5px 7px; border-bottom:1px solid #ccc; }
  .new-record-existing-row.preview { background:#d9d9d9; font-weight:800; }
  .new-record-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .new-record-actions button { padding:9px 15px; border:1px solid #222; background:#fff; font:inherit; font-weight:700; }
  .new-record-actions button:disabled { color:#777; border-color:#aaa; font-weight:400; }
  #propertyManagePanel { display:none; margin-top:12px; border-top:1px solid #222; padding-top:12px; }
  #propertyManagePanel.active { display:block; }
  .property-search-inputs { display:grid; grid-template-columns:minmax(0, 1fr) 150px; gap:7px; }
  #propertySearchInput, #propertyOrderSearchInput { width:100%; min-height:42px; padding:7px 9px; border:1px solid #777; font:inherit; }
  .property-selected-row { display:flex; flex-wrap:wrap; gap:6px; align-items:stretch; margin-top:8px; }
  .property-selected-row button { flex:0 0 auto; padding:7px 10px; border:1px solid #222; background:#fff; font:inherit; font-weight:700; }
  #propertySearchResults { margin-top:8px; max-height:240px; overflow:auto; border:1px solid #999; }
  .property-search-result {
    display:block; width:100%; padding:9px; border:0; border-bottom:1px solid #ccc;
    background:#fff; color:#111; text-align:left; font:inherit; cursor:pointer;
  }
  .property-search-result.selected { background:#d9d9d9; font-weight:800; }
  #propertySelectedInfo {
    display:block; flex:1; min-width:0; padding:9px; border:1px solid #222;
    background:#fff; font-weight:700; line-height:1.6;
  }
  @media (max-width:620px) {
    #newRecordDialog { padding:0; align-items:stretch; }
    #newRecordPanel { max-height:100vh; width:100%; border-radius:0; padding:12px; }
    .new-record-choice { min-height:38px; }
    .new-record-actions { position:sticky; bottom:-12px; background:#fff; padding:10px 0 12px; }
    .new-record-actions { flex-wrap:wrap; }
    .property-search-inputs { grid-template-columns:minmax(0, 1fr) 110px; }
    .new-record-actions button { flex:1 1 42%; }
  }

  /* テーブルラッパー：残り全高を占有、縦横両方スクロール */
  #tableWrapper {
    overflow: auto;
    /* 件数が少ないときは中身の高さに合わせ、多いときだけ上限まで伸ばしてスクロールする。
       上限は JS（adjustWrapperHeight）で画面の高さから計算して設定する。 */
    height: auto;
    max-height: calc(100vh - 88px);
    padding: 0;
  }
  #emptyMsg { text-align:center; padding:40px; color:#888; font-size:14px; }

  #dataTable { border-collapse:collapse; min-width:100%; background:#fff; border:1px solid #999; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
  #dataTable.compact-columns { width:max-content; min-width:0; }
  #dataTable.compact-columns thead th,
  #dataTable.compact-columns tbody td { max-width:180px; }
  /* thead は tableWrapper のスクロールコンテナ内で top:0 に固定 */
  #dataTable thead { position:sticky; top:0; z-index:50; }
  #dataTable thead th {
    background:#1a6eb5; color:#fff; padding:6px 6px;
    text-align:left; font-size:13px; font-weight:600;
    white-space:nowrap; border:1px solid #999;
    cursor:pointer; user-select:none;
  }
  #dataTable thead th:hover { background:#1558a0; }
  #dataTable thead th.sorted-asc::after  { content:' ▲'; font-size:9px; }
  #dataTable thead th.sorted-desc::after { content:' ▼'; font-size:9px; }
  #dataTable thead tr.saturday-group-row th {
    background:#fff; color:#111; text-align:center; font-weight:800;
    cursor:default; border:0 !important; height:34px; padding:0 !important;
    font-size:14px; white-space:nowrap; box-sizing:border-box;
  }
  #dataTable thead tr.saturday-group-row th:hover { background:#fff; }
  .saturday-title-box {
    display:flex; align-items:center; justify-content:center;
    width:calc(100% + 1px); height:34px; margin-right:-1px;
    border:1px solid #111; background:#fff; box-sizing:border-box;
  }
  #dataTable thead tr.saturday-group-row th:last-child .saturday-title-box {
    width:100%; margin-right:0;
  }
  #dataTable thead tr.saturday-column-row th {
    background:#fff; color:#111; padding:0 !important; border:0 !important;
    box-sizing:border-box;
  }
  #dataTable thead tr.saturday-column-row th:hover { background:#fff; }
  .saturday-column-box {
    display:flex; align-items:center; width:calc(100% + 1px); min-height:32px;
    margin-right:-1px; padding:6px; border:1px solid #111; border-top:0;
    background:#fff; color:#111; box-sizing:border-box;
  }

  .hist-item-cols { font-size:11px; color:#1a6eb5; margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-item-meta { font-size:10px; color:#6b7280; margin-top:2px; }
  .hist-item-time { font-size:10px; color:#93c5fd; margin-top:1px; }
  .hist-del-btn { background:none; border:none; color:#fca5a5;
    font-size:15px; cursor:pointer; padding:3px; flex-shrink:0; }

  #hist-empty { text-align:center; color:#9ca3af; font-size:12px; padding:28px 0 10px; line-height:1.8; }
  .property-history-section { padding:10px 10px 8px; border-bottom:1px solid #bbb; display:flex; flex:1; min-height:0; flex-direction:column; }
  #property-change-list { flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; }
  .property-change-item { display:grid; grid-template-columns:24px minmax(0,1fr); gap:7px; padding:8px; border:1px solid #aaa; margin-bottom:6px; background:#fff; }

  .property-change-detail { margin-top:3px; font-size:12px; font-weight:700; line-height:1.5; }
  .property-history-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .property-history-actions button { flex:1 1 46%; min-height:38px; padding:6px; border:1px solid #222; background:#fff; font:inherit; font-weight:700; }


  #collectionOrderActions { overflow:hidden; touch-action:pan-y pinch-zoom; gap:12px; padding-left:6px; padding-right:6px; }

<body>

<div id="app-header">

</div>

<div id="toolbar">

    <button class="tb-btn" id="btnAssignment" type="button" onclick="openAssignmentDialog()">担当者、曜日を選択 <span id="assignmentCount"></span></button>
    <button class="tb-btn" id="btnTogglePanel">☑ 列を選択</button>

    <button class="tb-btn" id="btnAllOff">全列非表示</button>
    <div class="toolbar-search">
      <input type="text" id="searchInput" placeholder="🔍 検索">
      <button type="button" id="searchClear" aria-label="検索文字を消す" title="検索文字を消す">×</button>
    </div>
    <button class="tb-btn" id="btnSave" style="background:#27ae60;color:#fff;border-color:#1e8449;font-weight:700;">💾 エクセル保存</button>
    <button class="tb-btn" onclick="toggleHistPanel()" style="background:#fffbeb;border-color:#f59e0b;color:#92400e;font-weight:700;">📌 履歴</button>

</div>

          <label class="assignment-option"><input type="checkbox" value="段紙(土)">段紙(土)</label>
          <label class="assignment-option"><input type="checkbox" value="金属">金属</label>
          <label class="assignment-option"><input type="checkbox" value="段紙">段紙</label>
          <label class="assignment-option"><input type="checkbox" value="ガラ">ガラ</label>
          <label class="assignment-option"><input type="checkbox" value="おむつ">おむつ</label>

<div id="newRecordDialog" role="dialog" aria-modal="true" aria-labelledby="newRecordTitle">

// ===== localStorage 状態保存・復元 =====
const STORAGE_KEY = 'keiryou_colview_state';
const STORAGE_MAP_KEY = 'keiryou_colview_state_by_sheet';
const LAST_FILE_SOURCE_KEY = 'colview_last_file_source_v1';
const LAST_WORKBOOK_DB = 'colview_last_workbook_v1';
const LAST_WORKBOOK_STORE = 'files';

function openLastWorkbookDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(LAST_WORKBOOK_DB, 1);
    request.onupgradeneeded = () => request.result.createObjectStore(LAST_WORKBOOK_STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function storeLastWorkbook(buf, filename) {
  try { localStorage.setItem(LAST_FILE_SOURCE_KEY, JSON.stringify({ type:'local', filename })); } catch (e) {}
  try {
    const db = await openLastWorkbookDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(LAST_WORKBOOK_STORE, 'readwrite');
      tx.objectStore(LAST_WORKBOOK_STORE).put({ filename, buf }, 'last');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch (e) {
    console.warn('前回ファイルの端末保存に失敗:', e);
  }
}

async function readLastWorkbook() {
  try {
    const db = await openLastWorkbookDb();
    const result = await new Promise((resolve, reject) => {
      const tx = db.transaction(LAST_WORKBOOK_STORE, 'readonly');
      const request = tx.objectStore(LAST_WORKBOOK_STORE).get('last');
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });
    db.close();
    return result;
  } catch (e) {
    return null;
  }
}

function saveState() {

}

function loadSavedState() {

    const map = JSON.parse(localStorage.getItem(STORAGE_MAP_KEY) || '{}');

    if (exact) return exact;

    const legacy = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!legacy || legacy.filename !== currentFilename) return null;
    if (!legacy.sheetName || legacy.sheetName === currentSheetName) return legacy;
    return null;
  } catch(e) { return null; }
}

function restoreCollectionOrdersToRows(collectionOrders) {
  if (!collectionOrders || typeof collectionOrders !== 'object') return 0;
  const districtCol = headers.findIndex(h => ['地区', '地区名'].includes(String(h || '').trim()));
  const propertyCol = headers.findIndex(h => ['契約物件', '物件名', '名前'].includes(String(h || '').trim()));
  let restored = 0;
  Object.entries(collectionOrders).forEach(([key, savedOrder]) => {
    const order = normalizedCollectionOrder(savedOrder);
    const [staff, day, district, ...propertyParts] = String(key).split('||');
    const property = propertyParts.join('||');
    if (order === null || !ASSIGNMENT_STAFF.includes(staff) || !ASSIGNMENT_DAYS.includes(day)) return;
    const dayCol = headers.findIndex(h => String(h || '').trim() === day);
    if (dayCol < 0) return;
    const row = dataArray.find(candidate => {
      const rowDistrict = districtCol >= 0 ? String(candidate[districtCol] || '').trim() : '';
      const rowProperty = propertyCol >= 0 ? String(candidate[propertyCol] || '').trim() : '';
      const weekdayValue = String(candidate[dayCol] || '').trim().replace('－', '-');
      return rowDistrict === district && rowProperty === property && weekdayValue.startsWith(staff);
    });
    if (!row) return;
    const nextValue = `${staff}${order}`;
    if (String(row[dayCol] || '').trim() !== nextValue) {
      row[dayCol] = nextValue;
      restored++;
    }
  });
  return restored;
}

function loadCollectionOrdersFromWeekdayCells(staffSet, daySet) {
  if (!staffSet?.size || !daySet?.size) return 0;
  let loaded = 0;
  dataArray.forEach(row => {
    daySet.forEach(day => {
      const dayCol = headers.findIndex(h => String(h || '').trim() === day);
      if (dayCol < 0) return;
      const value = String(row[dayCol] || '').trim().replace('－', '-');
      const staff = [...staffSet].find(prefix => value.startsWith(prefix));
      if (!staff) return;
      const suffix = value.slice(staff.length).match(/^\s*(\d+)/);
      if (!suffix) return;
      const key = assignmentRowKey(row, staff, day);
      const order = normalizedCollectionOrder(suffix[1]);
      if (order === null) return;
      draftCollectionOrders[key] = order;
      committedCollectionOrders[key] = order;
      loaded++;
    });
  });
  return loaded;
}

function collectionOrdersFromWeekdayCells(staffSet, daySet) {
  const orders = {};
  if (!staffSet?.size || !daySet?.size) return orders;
  dataArray.forEach(row => {
    daySet.forEach(day => {
      const dayCol = headers.findIndex(h => String(h || '').trim() === day);
      if (dayCol < 0) return;
      const value = String(row[dayCol] || '').trim().replace('－', '-');
      const staff = [...staffSet].find(prefix => value.startsWith(prefix));
      if (!staff) return;
      const suffix = value.slice(staff.length).match(/^\s*(\d+)/);
      const order = suffix ? normalizedCollectionOrder(suffix[1]) : null;
      if (order !== null) orders[assignmentRowKey(row, staff, day)] = order;
    });
  });
  return orders;
}

// 保存済み状態をデータ読込後に適用
function applyRestoredState(saved) {
  if (!saved) return;
  if(saved.editedPropertyTable && JSON.stringify(saved.editedPropertyTable.headers)===JSON.stringify(headers) && Array.isArray(saved.editedPropertyTable.rows)){
    dataArray=saved.editedPropertyTable.rows.map(row=>[...row]);
    propertyEditorApplied=true;
  }
  if (Array.isArray(saved.hiddenPropertyRecords) && hasPropertyTableHeaders()) {
    const registrationCol = findHeaderIndex(['登録番号']);
    const propertyCol = findHeaderIndex(['契約物件', '物件名', '名前']);
    const identity = row => {
      const registration = registrationCol >= 0 ? String(row[registrationCol] ?? '').trim() : '';
      return registration ? `id:${registration}` : `name:${propertyCol >= 0 ? String(row[propertyCol] ?? '').trim() : ''}`;
    };
    saved.hiddenPropertyRecords.forEach(record => {
      if (!Array.isArray(record.row) || record.sourceSheet !== currentSheetName) return;
      const key = identity(record.row);
      if (key === 'name:') return;
      const index = dataArray.findIndex(row => identity(row) === key);
      if (index >= 0) {
        const item = propertyRowInfo(dataArray[index]);
        dataArray.splice(index, 1);
        shiftOrdersForRemoval(item.order);
      }
      if (!hiddenPropertyRecords.some(item => item.sourceSheet === record.sourceSheet && identity(item.row) === key)) {
        hiddenPropertyRecords.push({...record,row:[...record.row]});
      }
    });
    syncHiddenPropertySheetToWorkbook();
  }
  // 列表示
  if (saved.visibleCols && saved.visibleCols.length) {
    visibleCols = new Set(saved.visibleCols.filter(i => i < headers.length));
    if (visibleCols.size === 0) visibleCols = new Set(headers.map((_,i) => i));
    syncCheckboxes();
  }
  // フィルター
  if (saved.filterState && saved.filterState.colIdx !== null) {
    filterState = {
      colIdx:         saved.filterState.colIdx,
      selectedValues: new Set(saved.filterState.selectedValues || []),
      filterType:     saved.filterState.filterType || 'exact'
    };
  }
  // ソート
  if (saved.sortState) sortState = saved.sortState;
  // 検索
  if (saved.searchQuery) searchInput.value = saved.searchQuery;
  if (saved.assignmentFilter) {
    assignmentFilter = {
      active: Boolean(saved.assignmentFilter.active),
      staff: new Set((saved.assignmentFilter.staff || []).filter(v => ASSIGNMENT_STAFF.includes(v))),
      days: new Set((saved.assignmentFilter.days || []).filter(v => ASSIGNMENT_DAYS.includes(v)))
    };
  }
  committedCollectionOrders = saved.collectionOrders && typeof saved.collectionOrders === 'object'
    ? { ...saved.collectionOrders }
    : {};
  draftCollectionOrders = { ...committedCollectionOrders };
  if (assignmentFilter.active) {
    loadCollectionOrdersFromWeekdayCells(assignmentFilter.staff, assignmentFilter.days);
  }
  collectionOrderSessionOrders = { ...draftCollectionOrders };
  collectionOrderInitialResetGroups = new Set();
  restoreCollectionOrdersToRows(committedCollectionOrders);
  collectionOrderUndoStack = [];
  updateAssignmentButton();
}

// ヘッダー行自動検出
function detectHeaderRow(raw) {
  const ne = r => (r||[]).filter(c => String(c).trim()!=='').length;
  let idx=0;
  for (let i=0; i<Math.min(5,raw.length-1); i++) {
    const currentCount = ne(raw[i]);
    const nextCount = ne(raw[i+1]);
    if (currentCount <= 3 && currentCount < nextCount) idx=i+1;
    else break;
  }
  return idx;
}

function excelCellType(value) {
  if (typeof value === 'number') return 'n';
  if (typeof value === 'boolean') return 'b';
  return 's';
}

function setWorksheetCellValue(ws, rowIndex, columnIndex, value, styleSource) {
  const address = XLSX.utils.encode_cell({ r:rowIndex, c:columnIndex });
  let cell = ws[address];
  const preferredType = (cell && cell.t) || (styleSource && styleSource.t) || '';
  let normalized = value === null || value === undefined ? '' : value;
  if (preferredType === 'n' && normalized !== '' && Number.isFinite(Number(normalized))) normalized = Number(normalized);
  if (!cell) {
    cell = {};
    if (styleSource && styleSource.s) cell.s = styleSource.s;
    ws[address] = cell;
  }
  delete cell.f;
  delete cell.F;
  delete cell.w;
  cell.v = normalized;
  cell.t = excelCellType(normalized);
}

function syncCurrentSheetToWorkbook() {
  if (!workbook || !currentSheetName || !headers.length) return;
  const ws = workbook.Sheets[currentSheetName];
  if (!ws) return;
  const bodyStart = currentHeaderRowIndex + 1;
  const oldCount = sheetDataRowCounts[currentSheetName] ?? dataArray.length;
  const rowCount = Math.max(oldCount, dataArray.length);
  const columnCount = headers.length;
  const templateRow = bodyStart + Math.max(0, Math.min(oldCount, dataArray.length) - 1);

  for (let rowOffset = 0; rowOffset < rowCount; rowOffset++) {
    for (let columnIndex = 0; columnIndex < columnCount; columnIndex++) {
      const rowIndex = bodyStart + rowOffset;
      const address = XLSX.utils.encode_cell({ r:rowIndex, c:columnIndex });
      const nextValue = rowOffset < dataArray.length ? (dataArray[rowOffset][columnIndex] ?? '') : '';
      const existing = ws[address];
      if (existing && String(existing.v ?? '') === String(nextValue)) continue;
      const styleSource = ws[XLSX.utils.encode_cell({ r:templateRow, c:columnIndex })];
      setWorksheetCellValue(ws, rowIndex, columnIndex, nextValue, styleSource);
    }
  }

  const originalRange = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']) : { s:{r:0,c:0}, e:{r:0,c:0} };
  originalRange.e.r = Math.max(currentHeaderRowIndex, bodyStart + dataArray.length - 1);
  originalRange.e.c = Math.max(originalRange.e.c, columnCount - 1);
  ws['!ref'] = XLSX.utils.encode_range(originalRange);
  sheetDataRowCounts[currentSheetName] = dataArray.length;
}

function hasPropertyTableHeaders() {
  const normalized = headers.map(header => String(header || '').trim());
  return normalized.includes('整理番号') && normalized.some(header => ['契約物件', '物件名', '名前'].includes(header));
}

function syncHiddenPropertySheetToWorkbook() {
  if (!workbook || !headers.length || !hasPropertyTableHeaders()) return;
  const rows = hiddenPropertyRecords.map(record => [
    ...headers.map((_, index) => record.row[index] ?? ''),
    record.sourceSheet || currentSheetName,
    record.originalOrder || '',
    Number.isInteger(record.originalIndex) ? record.originalIndex : ''
  ]);
  workbook.Sheets[HIDDEN_PROPERTY_SHEET] = XLSX.utils.aoa_to_sheet([
    [...headers, ...HIDDEN_PROPERTY_META_HEADERS],
    ...rows
  ]);
  if (!workbook.SheetNames.includes(HIDDEN_PROPERTY_SHEET)) workbook.SheetNames.push(HIDDEN_PROPERTY_SHEET);
  workbook.Workbook = workbook.Workbook || {};
  workbook.Workbook.Sheets = workbook.Workbook.Sheets || [];
  const sheetIndex = workbook.SheetNames.indexOf(HIDDEN_PROPERTY_SHEET);
  workbook.Workbook.Sheets[sheetIndex] = {
    ...(workbook.Workbook.Sheets[sheetIndex] || {}),
    name:HIDDEN_PROPERTY_SHEET,
    Hidden:1
  };
}

function loadHiddenPropertyRecordsFromWorkbook() {
  if (!hasPropertyTableHeaders()) return;
  hiddenPropertyRecords = [];
  if (!workbook || !workbook.Sheets[HIDDEN_PROPERTY_SHEET]) return;
  const raw = XLSX.utils.sheet_to_json(workbook.Sheets[HIDDEN_PROPERTY_SHEET], { header:1, defval:'' });
  if (!raw.length) return;
  const hiddenHeaders = raw[0].map(value => String(value || '').trim());
  const sourceSheetCol = hiddenHeaders.indexOf('元シート');
  const originalOrderCol = hiddenHeaders.indexOf('元の整理番号');
  const originalIndexCol = hiddenHeaders.indexOf('元の位置');
  raw.slice(1).forEach((savedRow, index) => {
    const row = headers.map(header => {
      const savedColumn = hiddenHeaders.indexOf(String(header || '').trim());
      return savedColumn >= 0 ? (savedRow[savedColumn] ?? '') : '';
    });
    if (!row.some(value => String(value || '').trim())) return;
    hiddenPropertyRecords.push({
      row,
      sourceSheet:sourceSheetCol >= 0 ? String(savedRow[sourceSheetCol] || '') : currentSheetName,
      originalOrder:originalOrderCol >= 0 ? Number(savedRow[originalOrderCol]) || 0 : 0,
      originalIndex:originalIndexCol >= 0 ? Number(savedRow[originalIndexCol]) || index : index
    });
  });
}

function ensureGaraColumn() {
  const cardboardIndex = headers.findIndex(header => String(header || '').trim() === '段紙');
  const garaIndex = headers.findIndex(header => String(header || '').trim() === 'ガラ');
  if (cardboardIndex < 0 || garaIndex >= 0) return;
  const insertIndex = cardboardIndex + 1;
  headers.splice(insertIndex, 0, 'ガラ');
  dataArray = dataArray.map(row => {
    const next = [...row];
    next.splice(insertIndex, 0, '');
    return next;
  });
}

// 指定シートのデータをロードして表示（シート切替にも使用）
function loadSheet(sheetName) {
  propertyEditorApplied=false;
  if (!workbook) return;
  const ws  = workbook.Sheets[sheetName];
  if (!ws) return;
  currentSheetName = sheetName;
  const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' })
                  .map(r => r.map(c => c===null||c===undefined ? '' : String(c)));
  const hIdx = detectHeaderRow(raw);
  currentHeaderRowIndex = hIdx;
  headers   = raw[hIdx] ? [...raw[hIdx]] : [];
  dataArray = raw.slice(hIdx+1);
  ensureGaraColumn();
  sheetDataRowCounts[sheetName] = dataArray.length;
  loadHiddenPropertyRecordsFromWorkbook();
  visibleCols  = new Set(headers.map((_,i) => i));
  sortState    = { col:-1, dir:0 };
  filterState  = { colIdx: null, selectedValues: new Set(), filterType: 'exact' };
  assignmentFilter = { active:false, staff:new Set(), days:new Set() };
  committedCollectionOrders = {};
  draftCollectionOrders = {};
  collectionOrderUndoStack = [];
  collectionOrderSessionOrders = {};
  collectionOrderInitialResetGroups = new Set();
  searchInput.value = '';
  buildColPanel();
  const saved = loadSavedState();
  if (saved) applyRestoredState(saved);
  renderTable();
  saveState();
}

// Excel読み込み
function loadWorkbookData(buf, filename, sourcePath) {
  propertyEditorApplied=false;
  try {
    const wb = XLSX.read(new Uint8Array(buf), { type:'array', cellStyles:true, cellDates:true });
    workbook = wb;
    currentFilename = filename;

    // シートセレクタを更新
    sheetSel.innerHTML = '';
    const selectableSheets = wb.SheetNames.filter(name => name !== HIDDEN_PROPERTY_SHEET);
    if (!selectableSheets.length) throw new Error('表示できるシートがありません');
    selectableSheets.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sheetSel.appendChild(opt);
    });
    let initialSheet = selectableSheets[0];
    try {
      const lastState = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (lastState && lastState.filename === filename && selectableSheets.includes(lastState.sheetName)) {
        initialSheet = lastState.sheetName;
      }
    } catch (e) {}
    sheetSel.value = initialSheet;
    sheetSel.disabled = false;
    currentSheetName = initialSheet;

    // 最初のシートのデータを展開
    const ws  = wb.Sheets[currentSheetName];
    const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' })
                    .map(r => r.map(c => c===null||c===undefined ? '' : String(c)));
    const hIdx = detectHeaderRow(raw);
    currentHeaderRowIndex = hIdx;
    headers   = raw[hIdx] ? [...raw[hIdx]] : [];
    dataArray = raw.slice(hIdx+1);

}

// GitHub ファイル一覧
function uniqueXlsxNames(names) {
  return [...new Set(names.map(name => String(name || '').replace(/^\//, '')))]
    .filter(name => /\.xlsx$/i.test(name));
}

function latestPropertyTableName(names) {
  const prefix = '2026年度物件表_KMN置換_列移動_';
  const candidates = names.map(name => {
    if (!name.startsWith(prefix)) return null;
    const timestamped = name.match(/_(\d{8})_(\d{4,6})\.xlsx$/i);
    if (timestamped) return { name, score: `${timestamped[1]}${timestamped[2].padEnd(6, '0')}` };
    const dated = name.match(/_(\d{4})-(\d{2})-(\d{2})\.xlsx$/i);
    if (!dated) return null;
    return { name, score: `${dated[1]}${dated[2]}${dated[3]}000000` };
  }).filter(Boolean);
  candidates.sort((a, b) => b.score.localeCompare(a.score) || b.name.localeCompare(a.name, 'ja'));
  return candidates.length ? candidates[0].name : null;
}

function getGitHubXlsxNames() {
  return fetch(GITHUB_API_URL + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if(!r.ok) throw new Error('GitHub API HTTP ' + r.status); return r.json(); })
    .then(files => uniqueXlsxNames(files.filter(f => f.type === 'file').map(f => f.name)))
    .catch(apiErr => {
      console.warn('GitHub API一覧取得エラー。予備取得に切替:', apiErr);
      return fetch(GITHUB_JSDELIVR_API + '?t=' + Date.now(), { cache: 'no-store' })
        .then(r => { if(!r.ok) throw new Error('jsDelivr HTTP ' + r.status); return r.json(); })
        .then(data => uniqueXlsxNames((data.files || []).map(f => f.name)))
        .catch(fallbackErr => {
          console.warn('予備一覧取得エラー。固定候補を表示:', fallbackErr);
          return uniqueXlsxNames(FALLBACK_XLSX_FILES);
        });
    });
}

function fetchGitHubFileList(loadFile = false, forceLatest = false) {
  if (gitListLoading) return;
  gitListLoading = true;
  const previousValue = gitFileSel.value;
  getGitHubXlsxNames()
    .then(xlsxNames => {
      gitFileSel.innerHTML = '';
      if (!xlsxNames.length) { gitFileSel.innerHTML='<option value="">ファイルなし</option>'; return; }
      const ph = document.createElement('option');
      ph.value=''; ph.textContent='📂 ファイルを選択…';
      gitFileSel.appendChild(ph);
      xlsxNames.forEach(name => {
        const o = document.createElement('option');
        o.value = encodeURIComponent(name);
        o.textContent = name;
        gitFileSel.appendChild(o);
      });
      const existsPrevious = previousValue && xlsxNames.some(name => encodeURIComponent(name) === previousValue);
      gitFileSel.value = existsPrevious ? previousValue : '';
      gitListLoadedAt = Date.now();
      const latestPropertyTable = latestPropertyTableName(xlsxNames);
      const defaultFile = xlsxNames.includes(DEFAULT_GITHUB_XLSX) ? DEFAULT_GITHUB_XLSX : null;
      const lastSource = getLastFileSource();
      const savedGitFile = lastSource?.type === 'git' && xlsxNames.includes(lastSource.filename)
        ? lastSource.filename
        : null;
      const target = forceLatest
        ? (latestPropertyTable || defaultFile || xlsxNames[0])
        : (savedGitFile || latestPropertyTable || defaultFile || xlsxNames[0]);
      if (target && loadFile) {
        gitFileSel.value = encodeURIComponent(target);
        loadFromGitHub(target);
      } else {
        updateStatus('GitHubのExcel候補を更新しました。候補を選ぶと読み込みます。');
      }
    })
    .catch(() => { gitFileSel.innerHTML='<option value="">⚠️ 候補更新失敗</option>'; })
    .finally(() => { gitListLoading = false; });
}

function loadFromGitHub(filename) {
  if (!filename) {
    const v = gitFileSel.value; if(!v) return;
    filename = decodeURIComponent(v);
  }
  const btn = document.getElementById('btnReload');
  btn.textContent='⏳ 読込中…'; btn.disabled=true;
  updateStatus('読み込み中…');
  fetch(GITHUB_RAW_BASE + encodeURIComponent(filename) + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
    .catch(err => {
      console.warn('raw.githubusercontent.com 読み込みエラー。予備取得に切替:', err);
      return fetch(GITHUB_JSDELIVR_RAW + encodeURIComponent(filename) + '?t=' + Date.now(), { cache: 'no-store' })
        .then(r => { if(!r.ok) throw new Error('jsDelivr HTTP '+r.status); return r.arrayBuffer(); });
    })
    .then(buf => {
      loadWorkbookData(buf, filename, 'GitHub: ' + GITHUB_REPO_LABEL);
      localStorage.setItem(LAST_FILE_SOURCE_KEY, JSON.stringify({ type:'git', filename }));
    })
    .catch(e => updateStatus('⚠️ 読み込み失敗: '+e.message))
    .finally(() => { btn.textContent='🔄 GITの最新を取得'; btn.disabled=false; });
}

const newRecordDialog = document.getElementById('newRecordDialog');

const PROPERTY_CHANGE_HISTORY_KEY = 'colview_property_change_history_v1';

function getPropertyChangeHistory() {
  try { return JSON.parse(localStorage.getItem(PROPERTY_CHANGE_HISTORY_KEY) || '[]'); } catch (e) { return []; }
}

function setPropertyChangeHistory(items) {
  try { localStorage.setItem(PROPERTY_CHANGE_HISTORY_KEY, JSON.stringify(items)); } catch (e) {}
}

function recordPropertyChange(type, row, fieldChange = null) {
  const items = getPropertyChangeHistory();
  const summary = propertyRowInfo(row);
  const registrationCol = findHeaderIndex(['登録番号']);
  const registration = registrationCol >= 0 ? String(row[registrationCol] || '') : '';
  const isSameUnsentUpdate = item => type === 'update' && item.type === 'update' && !item.sentAt &&
    item.filename === currentFilename && item.sheetName === currentSheetName &&
    registrationCol >= 0 && String(item.row[registrationCol] || '') === registration;
  const existing = items.find(isSameUnsentUpdate);
  if (existing) {
    existing.row = [...row];
    existing.summary = summary;
    existing.timestamp = Date.now();
    if (fieldChange) {
      existing.changes = Array.isArray(existing.changes) ? existing.changes : [];
      const savedChange = existing.changes.find(change => change.index === fieldChange.index);
      if (savedChange) {
        savedChange.after = fieldChange.after;
        if (savedChange.before === savedChange.after) {
          existing.changes = existing.changes.filter(change => change !== savedChange);
        }
      } else if (fieldChange.before !== fieldChange.after) {
        existing.changes.push({ ...fieldChange });
      }
    }
  } else {
    items.unshift({
      id:`pc-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
      timestamp:Date.now(), type, row:[...row], summary,
      changes:fieldChange && fieldChange.before !== fieldChange.after ? [{ ...fieldChange }] : [],
      filename:currentFilename, sheetName:currentSheetName, sentAt:null
    });
  }
  setPropertyChangeHistory(items);
  if (typeof window.renderPropertyChangeHistory === 'function') window.renderPropertyChangeHistory();
  return items[0];
}

function recordCollectionOrderChanges(changes) {
  if (!Array.isArray(changes) || !changes.length) return;
  const items = getPropertyChangeHistory();
  const first = changes[0];
  items.unshift({
    id:`pc-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
    timestamp:Date.now(),
    type:'collection_order',
    row:[...first.row],
    summary:{
      ...propertyRowInfo(first.row),
      property:`${first.staff}／${first.day}（${changes.length}件）`
    },
    changes:changes.map(change => ({
      registration:propertyRowInfo(change.row).registration,
      property:change.property,
      index:change.dayCol,
      header:`${change.day}（${change.property || '名称未入力'}）`,
      before:change.before,
      after:change.after
    })),
    filename:currentFilename,
    sheetName:currentSheetName,
    sentAt:null
  });
  setPropertyChangeHistory(items);
  if (typeof window.renderPropertyChangeHistory === 'function') window.renderPropertyChangeHistory();
}

function recordExcelSave(filename) {
  const items = getPropertyChangeHistory();
  items.unshift({
    id:`pc-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
    timestamp:Date.now(),
    type:'excel_save',
    row:[],
    summary:{ property:filename, district:'', registration:'', order:0 },
    changes:[{ index:-1, header:'保存したファイル名', before:'', after:filename }],
    filename,
    sheetName:currentSheetName,
    sentAt:null
  });
  setPropertyChangeHistory(items);
  if (typeof window.renderPropertyChangeHistory === 'function') window.renderPropertyChangeHistory();
}

function findHeaderIndex(names) {
  return headers.findIndex(header => names.includes(String(header || '').trim()));
}

function uniqueColumnValues(columnIndex) {
  if (columnIndex < 0) return [];
  return [...new Set(dataArray.map(row => String(row[columnIndex] || '').trim()).filter(Boolean))].sort(natCmp);
}

function nextRegistrationNumber(columnIndex) {
  const numbers = uniqueColumnValues(columnIndex)
    .map(value => Number(String(value).replace(/[^0-9]/g, '')))
    .filter(Number.isFinite);
  return numbers.length ? String(Math.max(...numbers) + 1) : '1';
}

function normalizePropertySearch(value) {
  return String(value || '').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, char =>
    String.fromCharCode(char.charCodeAt(0) - 0x60)
  ).replace(/[\s　・･ー\-]/g, '');
}

function propertyRowInfo(row) {
  const districtCol = findHeaderIndex(['地区', '地区名']);
  const propertyCol = findHeaderIndex(['契約物件', '物件名', '名前']);
  const registrationCol = findHeaderIndex(['登録番号']);
  const orderCol = findHeaderIndex(['整理番号']);
  return {
    district: districtCol >= 0 ? String(row[districtCol] || '').trim() : '',
    property: propertyCol >= 0 ? String(row[propertyCol] || '').trim() : '',
    registration: registrationCol >= 0 ? String(row[registrationCol] || '').trim() : '',
    order: orderCol >= 0 ? Number(row[orderCol]) || 0 : 0
  };
}

function loadPropertyIntoRegistrationFields(row) {
  newRecordDraft = Array(headers.length).fill('').map((_, index) => String(row[index] || ''));
  const orderCol = findHeaderIndex(['整理番号']);
  newRecordOrderPreview = orderCol >= 0 ? Number(newRecordDraft[orderCol]) || null : null;
  renderNewRecordFields();
  syncNewRecordMode();
}

function syncNewRecordMode() {
  const submit = document.getElementById('newRecordSubmit');
  const editing = !!selectedPropertyRow;
  submit.disabled = false;
  submit.textContent = editing ? '変更を反映する' : '新規登録します';
}

function clearPropertyRegistrationFields() {
  newRecordDraft = Array(headers.length).fill('');
  newRecordOrderPreview = null;
  const registrationCol = findHeaderIndex(['登録番号']);
  if (registrationCol >= 0) newRecordDraft[registrationCol] = nextRegistrationNumber(registrationCol);
  selectedPropertyRow = null;
  document.getElementById('propertySelectedInfo').textContent = '物件を選択してください';
  document.getElementById('propertySearchResults').querySelectorAll('.property-search-result').forEach(entry => entry.classList.remove('selected'));
  renderNewRecordFields();
  syncNewRecordMode();
  showToast('上のデータを消しました');
}

function renderPropertySearchResults() {
  const results = document.getElementById('propertySearchResults');
  const input = document.getElementById('propertySearchInput');
  const orderInput = document.getElementById('propertyOrderSearchInput');
  const info = document.getElementById('propertySelectedInfo');
  results.innerHTML = '';
  selectedPropertyRow = null;
  info.textContent = propertyManageMode === 'restore' ? '戻す物件を選択してください' : '物件を選択してください';
  const source = propertyManageMode === 'restore'
    ? hiddenPropertyRecords
        .filter(item => !item.sourceSheet || item.sourceSheet === currentSheetName)
        .map(item => item.row)
    : dataArray;
  const query = normalizePropertySearch(input.value);
  const orderQuery = String(orderInput.value || '').trim();
  if (propertyManageMode === 'search' && !orderQuery && query.length < 1) {
    results.textContent = '物件名を1文字以上、または整理番号を入力すると候補を表示します。';
    return;
  }
  const matches = source.filter(row => {
    const item = propertyRowInfo(row);
    if (!item.property) return false;
    if (propertyManageMode === 'restore') return true;
    const nameMatches = !query || normalizePropertySearch(item.property).includes(query);
    const orderMatches = !orderQuery || String(item.order) === orderQuery;
    return nameMatches && orderMatches;
  }).slice(0, 100);
  matches.forEach(row => {
    const item = propertyRowInfo(row);
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'property-search-result';
    button.textContent = `${item.order || '-'}｜${item.district}｜${item.property}｜登録番号 ${item.registration || '-'}`;
    button.addEventListener('click', () => {
      results.querySelectorAll('.property-search-result').forEach(entry => entry.classList.toggle('selected', entry === button));
      selectedPropertyRow = row;
      loadPropertyIntoRegistrationFields(row);
      info.textContent = `選択中：${item.property}　地区：${item.district || '-'}　整理番号：${item.order || '-'}　登録番号：${item.registration || '-'}`;
      if (propertyManageMode === 'restore') restoreHiddenProperty(row);
    });
    results.appendChild(button);
  });
  if (!matches.length) results.textContent = propertyManageMode === 'restore' ? '非表示の物件はありません。' : '該当する物件がありません。';
}

function shiftOrdersForRemoval(removedOrder) {
  const orderCol = findHeaderIndex(['整理番号']);
  if (orderCol < 0 || removedOrder < 1) return;
  dataArray.forEach(row => {
    const current = Number(row[orderCol]);
    if (Number.isFinite(current) && current > removedOrder) row[orderCol] = String(current - 1);
  });
}

function shiftOrdersForRestore(restoredOrder) {
  const orderCol = findHeaderIndex(['整理番号']);
  if (orderCol < 0 || restoredOrder < 1) return;
  dataArray.forEach(row => {
    const current = Number(row[orderCol]);
    if (Number.isFinite(current) && current >= restoredOrder) row[orderCol] = String(current + 1);
  });
}

function restoreHiddenProperty(row) {
  const hiddenIndex = hiddenPropertyRecords.findIndex(item => item.row === row);
  if (hiddenIndex < 0) return;
  const record = hiddenPropertyRecords[hiddenIndex];
  const item = propertyRowInfo(record.row);
  shiftOrdersForRestore(record.originalOrder);
  const orderCol = findHeaderIndex(['整理番号']);
  if (orderCol >= 0) record.row[orderCol] = String(record.originalOrder);
  dataArray.splice(Math.min(record.originalIndex, dataArray.length), 0, record.row);
  hiddenPropertyRecords.splice(hiddenIndex, 1);
  syncHiddenPropertySheetToWorkbook();
  recordPropertyChange('restore', record.row);
  selectedPropertyRow = null;
  renderTable(); renderPropertySearchResults();
  showToast(`${item.property}を元の位置へ戻しました`);
  saveState();
}

    }
    const row = document.createElement('div');

function applyExistingPropertyField(columnIndex) {
  if (!selectedPropertyRow || !dataArray.includes(selectedPropertyRow)) {
    showToast('物件検索で変更する物件を選択してください');
    return;
  }
  const orderCol = findHeaderIndex(['整理番号']);
  const beforeValue = String(selectedPropertyRow[columnIndex] || '').trim();
  if (columnIndex === orderCol) {
    const oldOrder = Number(selectedPropertyRow[orderCol]);
    const newOrder = Number(newRecordDraft[orderCol]);
    if (!Number.isInteger(newOrder) || newOrder < 1) { showToast('整理番号を入力してください'); return; }
    dataArray.forEach(row => {
      if (row === selectedPropertyRow) return;
      const current = Number(row[orderCol]);
      if (!Number.isFinite(current)) return;
      if (newOrder < oldOrder && current >= newOrder && current < oldOrder) row[orderCol] = String(current + 1);
      if (newOrder > oldOrder && current > oldOrder && current <= newOrder) row[orderCol] = String(current - 1);
    });
    selectedPropertyRow[orderCol] = String(newOrder);
    dataArray.sort((a, b) => (Number(a[orderCol]) || Number.MAX_SAFE_INTEGER) - (Number(b[orderCol]) || Number.MAX_SAFE_INTEGER));
    newRecordOrderPreview = newOrder;
  } else {
    selectedPropertyRow[columnIndex] = newRecordDraft[columnIndex];
  }
  const afterValue = String(selectedPropertyRow[columnIndex] || '').trim();
  rememberExistingPropertyChange(selectedPropertyRow, {
    index:columnIndex,
    header:String(headers[columnIndex] || `列${columnIndex + 1}`).trim(),
    before:beforeValue,
    after:afterValue
  });
  renderTable();
  renderExistingDistrictProperties();
  const item = propertyRowInfo(selectedPropertyRow);
  document.getElementById('propertySelectedInfo').textContent = `選択中：${item.property}　地区：${item.district || '-'}　整理番号：${item.order || '-'}　登録番号：${item.registration || '-'}`;
  saveState();
  const label = String(headers[columnIndex] || `列${columnIndex + 1}`).trim();
  showToast(`${label}を変更しました`);
}

function syncSaturdayGroupToPropertySheet(groupKey) {
  if (!['inner', 'outer'].includes(groupKey) || !workbook?.Sheets?.['物件表']) return;
  const group = SATURDAY_GROUPS[groupKey];
  const ws = workbook.Sheets['物件表'];
  const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
  const headerRow = detectHeaderRow(raw);
  const mainHeaders = (raw[headerRow] || []).map(value => String(value || '').trim());
  const propertyCol = mainHeaders.findIndex(header => ['契約物件', '物件名', '名前'].includes(header));
  const saturdayCol = mainHeaders.indexOf('土曜日');
  if (propertyCol < 0 || saturdayCol < 0) return;
  const prefix = groupKey === 'inner' ? '内-' : '外-';
  raw.forEach((row, rowIndex) => {
    if (rowIndex <= headerRow) return;
    if (String(row[saturdayCol] || '').trim().startsWith(prefix)) setWorksheetCellValue(ws, rowIndex, saturdayCol, '');
  });
  dataArray.forEach((row, index) => {
    const property = String(row[group.property] || '').trim();
    if (!property) return;
    const target = raw.findIndex((mainRow, rowIndex) => rowIndex > headerRow
      && normalizePropertySearch(mainRow[propertyCol]) === normalizePropertySearch(property));
    if (target >= 0) setWorksheetCellValue(ws, target, saturdayCol, `${prefix}${index + 1}`);
  });
}

function restoreSaturdayExisting(hiddenIndex) {
  const index = Number.isInteger(hiddenIndex) ? hiddenIndex : -1;
  const hidden = index >= 0 ? hiddenSaturdayPermitItems.splice(index, 1)[0] : null;
  if (!hidden) { showToast('再表示する物件はありません'); return; }
  const groupKey = hidden.groupKey;
  const group = SATURDAY_GROUPS[groupKey];
  const columns = [group.district, group.property, group.note];
  if (group.order >= 0) columns.push(group.order);
  while (dataArray.length <= hidden.index) dataArray.push(Array(headers.length).fill(''));
  let blankIndex = dataArray.findIndex((row, index) => index >= hidden.index && !String(row[group.property] || '').trim());
  if (blankIndex < 0) {
    blankIndex = dataArray.length;
    dataArray.push(Array(headers.length).fill(''));
  }
  for (let index = blankIndex; index > hidden.index; index -= 1) {
    columns.forEach(column => { dataArray[index][column] = dataArray[index - 1][column] ?? ''; });
  }
  columns.forEach(column => { dataArray[hidden.index][column] = hidden.values[column] ?? ''; });
  if (group.order >= 0) dataArray.forEach((row, index) => { row[group.order] = String(index + 1); });
  syncSaturdayGroupToPropertySheet(groupKey);
  propertyEditorApplied = true;
  syncCurrentSheetToWorkbook();
  document.getElementById('saturdayExistingRestore').disabled = hiddenSaturdayPermitItems.length === 0;
  renderSaturdayHiddenList();
  if (document.getElementById('saturdayAddGroup').value !== groupKey) {
    document.getElementById('saturdayAddGroup').value = groupKey;
    document.getElementById('saturdayAddGroupValue').textContent = group.label;
    document.querySelectorAll('#saturdayAddGroupChoices button').forEach(button => button.classList.toggle('selected', button.dataset.group === groupKey));

function applySaturdayOrderToPropertySheet(groupKey, property, requestedOrder) {
  if (!['inner', 'outer'].includes(groupKey) || !workbook?.Sheets?.['物件表']) return true;
  const ws = workbook.Sheets['物件表'];
  const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
  const headerRow = detectHeaderRow(raw);
  const mainHeaders = (raw[headerRow] || []).map(value => String(value || '').trim());
  const propertyCol = mainHeaders.findIndex(header => ['契約物件', '物件名', '名前'].includes(header));
  const saturdayCol = mainHeaders.indexOf('土曜日');
  if (propertyCol < 0 || saturdayCol < 0) return false;
  const normalizedTarget = normalizePropertySearch(property);
  const targetRow = raw.findIndex((row, index) => index > headerRow
    && normalizePropertySearch(row[propertyCol]) === normalizedTarget);
  if (targetRow < 0) return false;

  const prefix = groupKey === 'inner' ? '内-' : '外-';
  raw.forEach((row, rowIndex) => {
    if (rowIndex <= headerRow || rowIndex === targetRow) return;
    const current = String(row[saturdayCol] || '').trim();
    const match = current.match(new RegExp(`^${prefix}(\\d+)$`));
    if (match && Number(match[1]) >= requestedOrder) {
      setWorksheetCellValue(ws, rowIndex, saturdayCol, `${prefix}${Number(match[1]) + 1}`);
    }
  });
  setWorksheetCellValue(ws, targetRow, saturdayCol, `${prefix}${requestedOrder}`);
  return true;
}

function recordSaturdayPermitAddition(group, district, property, note, requestedOrder, mainSheetUpdated) {
  const items = getPropertyChangeHistory();
  const changes = [
    { index:-1, header:'区分', before:'', after:group.label },
    { index:-1, header:'順番', before:'', after:String(requestedOrder) },
    { index:-1, header:'地区', before:'', after:district },
    { index:-1, header:'物件名', before:'', after:property }
  ];
  if (note) changes.push({ index:-1, header:'区分・備考', before:'', after:note });
  if (mainSheetUpdated && group.order >= 0) {
    const prefix = group.label === '内回り' ? '内-' : '外-';
    changes.push({ index:-1, header:'物件表・土曜日', before:'', after:`${prefix}${requestedOrder}` });
  }
  items.unshift({
    id:`pc-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
    timestamp:Date.now(),
    type:'saturday_permit_add',
    row:[],
    summary:{ property, district, registration:'', order:requestedOrder, group:group.label },
    changes,
    filename:currentFilename,
    sheetName:currentSheetName,
    sentAt:null
  });
  setPropertyChangeHistory(items);
  if (typeof window.renderPropertyChangeHistory === 'function') window.renderPropertyChangeHistory();
}

function addSaturdayPermitProperty() {
  if (currentSheetName !== SATURDAY_PERMIT_SHEET) return;
  const groupKey = document.getElementById('saturdayAddGroup').value;
  const group = SATURDAY_GROUPS[groupKey];
  const district = document.getElementById('saturdayAddDistrict').value.trim();
  const property = document.getElementById('saturdayAddProperty').value.trim();
  const note = document.getElementById('saturdayAddNote').value.trim();
  const requestedOrder = Number(document.getElementById('saturdayAddOrder').value);
  if (!group) { showToast('区分を選択してください'); return; }
  if (!district) { showToast('地区を入力してください'); return; }
  if (!property) { showToast('物件名を入力してください'); return; }
  if (!Number.isInteger(requestedOrder) || requestedOrder < 1) { showToast('順番を入力してください'); return; }
  const duplicate = dataArray.some(row => String(row[group.property] || '').trim() === property);
  if (duplicate) { showToast(`${group.label}に同じ物件名があります`); return; }

  const rowIndex = requestedOrder - 1;
  while (dataArray.length <= rowIndex) dataArray.push(Array(headers.length).fill(''));
  let blankIndex = dataArray.findIndex((row, index) => index >= rowIndex && !String(row[group.property] || '').trim());
  if (blankIndex < 0) {
    blankIndex = dataArray.length;
    dataArray.push(Array(headers.length).fill(''));
  }
  const groupColumns = [group.district, group.property, group.note];
  if (group.order >= 0) groupColumns.push(group.order);
  for (let index = blankIndex; index > rowIndex; index -= 1) {
    while (dataArray[index].length < headers.length) dataArray[index].push('');
    groupColumns.forEach(column => { dataArray[index][column] = dataArray[index - 1][column] ?? ''; });
  }
  const row = dataArray[rowIndex];
  while (row.length < headers.length) row.push('');
  row[group.district] = district;
  row[group.property] = property;
  row[group.note] = note;
  if (group.order >= 0) {
    dataArray.forEach((item, index) => { item[group.order] = String(index + 1); });
  }
  const mainSheetUpdated = applySaturdayOrderToPropertySheet(groupKey, property, requestedOrder);
  const historyItem = recordSaturdayPermitAddition(group, district, property, note, requestedOrder, mainSheetUpdated);

  propertyEditorApplied = true;
  syncCurrentSheetToWorkbook();
  renderTable();
  saveState();
  lastSaturdayPermitHistoryId = historyItem.id;
  document.getElementById('saturdayAddApply').disabled = true;
  document.getElementById('saturdayAddMail').disabled = false;
  showToast(mainSheetUpdated
    ? `${group.label}の${rowIndex + 1}番を保存しました`
    : `${group.label}へ保存しましたが、物件表に同じ物件名が見つかりません`);
}

function sendLastSaturdayPermitMail() {
  const history = getPropertyChangeHistory();
  const historyItem = history.find(item => item.id === lastSaturdayPermitHistoryId);
  if (!historyItem) { showToast('先に設定保存を押してください'); return; }

    document.getElementById('saturdayAddMail').disabled = true;

    showToast('メール画面を開き、履歴を送信済みにしました');
  }
}

async function saveWholeTableScreenshot() {
  if (!headers.length || dataTable.style.display === 'none') {
    showToast('スクショする表を表示してください');
    return;
  }
  if (typeof html2canvas !== 'function') {
    showToast('スクショ機能を読み込めません。通信状態を確認してください');
    return;
  }

  const button = document.getElementById('btnScreenshot');
  const originalText = button.textContent;
  const previewWindow = window.open('', '_blank');
  if (previewWindow) {
    previewWindow.document.title = 'スクショ作成中';
    previewWindow.document.body.textContent = 'スクショを作成しています…';
  }
  button.disabled = true;
  button.textContent = '作成中…';
  showToast('表全体のスクショを作成しています');

  try {
    const width = Math.max(dataTable.scrollWidth, dataTable.offsetWidth);
    const height = Math.max(dataTable.scrollHeight, dataTable.offsetHeight);
    const maxDimension = 8192;
    const maxPixels = 16000000;
    const scale = Math.min(1, maxDimension / Math.max(width, height), Math.sqrt(maxPixels / Math.max(1, width * height)));
    const canvas = await html2canvas(dataTable, {
      backgroundColor:'#ffffff', scale, width, height, windowWidth:width, windowHeight:height,
      scrollX:0, scrollY:0, useCORS:true, logging:false,
      onclone:clonedDocument => {
        const clonedWrapper = clonedDocument.getElementById('tableWrapper');
        const clonedHead = clonedDocument.querySelector('#dataTable thead');
        if (clonedWrapper) {
          clonedWrapper.scrollTop = 0;
          clonedWrapper.scrollLeft = 0;
          clonedWrapper.style.overflow = 'visible';
          clonedWrapper.style.maxHeight = 'none';
        }
        if (clonedHead) {
          clonedHead.style.position = 'static';
          clonedHead.style.top = 'auto';
        }
      }
    });
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('画像を作成できませんでした');
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = screenshotFilename();
    document.body.appendChild(link);
    link.click();
    link.remove();
    if (previewWindow && !previewWindow.closed) previewWindow.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    showToast(previewWindow ? 'スクショを保存して表示しました' : 'スクショを保存しました');
  } catch (error) {
    console.error(error);
    if (previewWindow && !previewWindow.closed) previewWindow.close();
    showToast('スクショを作成できませんでした');
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
}

function adjustWrapperHeight() {
  const wrapper = document.getElementById('tableWrapper');
  if (!wrapper) return;
  const orderActions = document.getElementById('collectionOrderActions');
  const actionsH = 0; // 操作列は上部パネル内。表のtopに高さが含まれる。
  const zoom = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
  // 表の上にあるもの（ヘッダー・ツールバー・列パネル・上部タブバー）を
  // 1つずつ足すと数え漏れが出るので、表の実際の位置から高さを決める。
  // iPhone の Safari は下のツールバーの出入りで表示領域の高さが変わる。
  // window.innerHeight だと実際より小さく（または大きく）なるので visualViewport を優先する。
  const viewH = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const top = wrapper.getBoundingClientRect().top;
  const height = Math.round((viewH - top - actionsH) / zoom);
  if (Number.isFinite(height) && height > 120) {
    // height ではなく max-height。件数が少ないときは中身の高さで止まり、
    // 表の下に白い余白が残らない。
    wrapper.style.height = 'auto';
    wrapper.style.maxHeight = height + 'px';
    return;
  }
  // 位置が測れない場合の保険（従来の計算）
  const headerH  = document.getElementById('app-header').offsetHeight;
  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const panelH   = colPanel.classList.contains('active') ? colPanel.offsetHeight : 0;
  const tabbar   = document.getElementById('uenoGlobalTabbar');
  const tabbarH  = tabbar ? tabbar.offsetHeight : 0;
  wrapper.style.height = 'auto';
  wrapper.style.maxHeight = `calc(100vh - ${headerH + toolbarH + panelH + actionsH + tabbarH}px)`;
}

/* 画面まわりが変わったら高さを測り直す。
   ・iPhone の Safari のツールバーが出入りしたとき（visualViewport）
   ・ツールバーや列パネルを開閉したとき（アニメーション終了まで待つ）
   ・上部タブバーが後から差し込まれたとき */
(function watchLayoutChanges() {
  const recalc = () => adjustWrapperHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', recalc);
    window.visualViewport.addEventListener('scroll', recalc);
  }
  document.addEventListener('transitionend', event => {
    const id = event.target && event.target.id;
    if (id === 'toolbar' || id === 'colPanel' || id === 'collectionOrderActions') recalc();
  });
  window.addEventListener('orientationchange', () => setTimeout(recalc, 300));
  if (typeof ResizeObserver !== 'undefined') {
    const observer = new ResizeObserver(recalc);
    const observeById = id => { const el = document.getElementById(id); if (el) observer.observe(el); };
    const attach = () => ['app-header', 'toolbar', 'colPanel', 'collectionOrderActions', 'uenoGlobalTabbar'].forEach(observeById);
    attach();
    window.addEventListener('load', () => { attach(); recalc(); });
  }
})();

// 自然順ソート
function natCmp(a, b) {
  const re=/(\d+)/g;
  const sp = s => {
    const p=[]; let last=0, m; re.lastIndex=0;
    while((m=re.exec(s))!==null){
      if(m.index>last) p.push({t:'s',v:s.slice(last,m.index)});
      p.push({t:'n',v:parseInt(m[0],10)}); last=m.index+m[0].length;
    }
    if(last<s.length) p.push({t:'s',v:s.slice(last)});
    return p;
  };
  const pa=sp(a), pb=sp(b);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const xa=pa[i],xb=pb[i];
    if(!xa) return -1; if(!xb) return 1;
    if(xa.t==='n'&&xb.t==='n'){ if(xa.v!==xb.v) return xa.v-xb.v; }
    else { const c=String(xa.v).localeCompare(String(xb.v),'ja'); if(c!==0) return c; }
  }
  return 0;
}

function weekdayAssignmentCmp(a, b, direction) {
  const parse = value => {
    // 担当者記号は画面から追加できるので特定の文字を列挙しない。
    // 「記号＋区切り（＋番号）」の形ならすべて対象にする。
    const match = String(value || '').trim().replace('－', '-').match(/^([^\d\s-]{1,10})-\s*(\d+)?$/);
    return match ? { staff:match[1].toUpperCase(), order:match[2] ? Number(match[2]) : null } : null;
  };
  const pa = parse(a), pb = parse(b);
  if (!pa || !pb) return direction * natCmp(a, b);
  const staffOrder = pa.staff.localeCompare(pb.staff, 'ja');
  if (staffOrder !== 0) return direction * staffOrder;
  if (pa.order === null && pb.order === null) return 0;
  if (pa.order === null) return 1;
  if (pb.order === null) return -1;
  return direction * (pa.order - pb.order);
}

function districtBackground(district) {
  const text = String(district || '').trim();
  if (!text) return '#fff';
  const fixedColors = {
    '白鳳通り':'#dbeafe',
    '佐那具':'#fce7f3',
  };
  if (fixedColors[text]) return fixedColors[text];
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = ((hash * 31) + text.charCodeAt(i)) >>> 0;
  return `hsl(${hash % 360} 58% 88%)`;
}

function assignmentRowKey(row, staff, day) {
  const districtCol = headers.findIndex(h => ['地区', '地区名'].includes(String(h || '').trim()));
  const propertyCol = headers.findIndex(h => ['契約物件', '物件名', '名前'].includes(String(h || '').trim()));
  const district = districtCol >= 0 ? String(row[districtCol] || '').trim() : '';
  const property = propertyCol >= 0 ? String(row[propertyCol] || '').trim() : '';
  return [staff, day, district, property].join('||');
}

function loadKeiryoSavedToday() {
  const now = Date.now();
  if (_keiryoSavedCache && now - _keiryoSavedCacheAt < 1500) return _keiryoSavedCache;
  let out = {};
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEIRYO_SESSION) || 'null');

      Object.keys(s.entryData || {}).forEach(n => { out[keiryoNameNorm(n)] = true; });

  // パネルは開いていたソフトを最小化するだけなので、物件表の画面はそのまま残る。
  if (window.parent !== window) {
    try {
      sessionStorage.setItem(KEIRYO_RETURN_APP_KEY, 'index_2-4_colview.html');
      window.parent.postMessage({ type: 'ueno-open-app', file: 'index_3-20.html', dir: 'forward' }, location.origin);

function keiryoDoneCount() {
  const propertyCol = findHeaderIndex(['契約物件', '物件名', '名前']);
  const keiryouCol = findHeaderIndex(['計量']);
  let total = 0, done = 0;
  if (propertyCol < 0 || keiryouCol < 0) return { done: 0, total: 0 };
  displayedAssignmentRows.forEach(item => {
    const nm = String(item.row[propertyCol] || '').trim();

   対応表を正式な計量物件の一覧として扱う。 */
function isKeiryouProperty(row, keiryouCol, name) {

  if (![2, 6, 10].includes(colIndex)) return '';
  if (String(row[colIndex] || '').trim() !== '計量') return '';
  const propertyName = String(row[colIndex - 1] || '').replace(/[\r\n]+/g, ' ').trim();

function geoRegisteredCount() {

  let done = 0;
  displayedAssignmentRows.forEach(item => {

    if (nm && (store[nm]||sharedGeoStatus(item.row[findHeaderIndex(['登録番号'])]))) done++;
  });
