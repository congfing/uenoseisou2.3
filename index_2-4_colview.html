async function registerGeoPoint(btn, name) {
  if (!name) { showToast('物件名が取得できません'); return; }
  const shared=sharedGeoStatus(btn.dataset.registration);
  if(shared){alert(`この物件は登録済みです（${shared.at}）。\n重複登録を防ぐため、新たな地点登録は行いません。修正が必要な場合はお知らせください。`);return;}
  // 登録済みをもう一度押したら解除（間違えて押したときのやり直し用）
  if (getGeo(name)) {
    if (!await propertyConfirm(`${name} の地点登録を解除しますか？\n（解除後、正しい場所でもう一度押してください）`)) return;
    const store = loadGeoStore();
    delete store[name];
    saveGeoStore(store);
    updateGeoButtonState(btn, name);
    const c = geoRegisteredCount();
    showToast(`${name} の地点登録を解除しました　${c.done}/${c.total}件`);
    return;
  }
  if (!navigator.geolocation) { showToast('この端末では位置情報を取得できません'); return; }
  btn.disabled = true;
  btn.textContent = '取得中…';
  navigator.geolocation.getCurrentPosition(pos => {
    const store = loadGeoStore();
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    store[name] = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      acc: Math.round(pos.coords.accuracy),
      at: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`
    };
    saveGeoStore(store);
    updateGeoButtonState(btn, name);
    const c = geoRegisteredCount();
    showToast(`${name} を登録（誤差約${store[name].acc}m）　${c.done}/${c.total}件`);
  }, err => {
    updateGeoButtonState(btn, name);
    const msg = {1:'位置情報の利用が許可されていません。設定で許可してください。',2:'現在地を取得できませんでした。',3:'時間内に取得できませんでした。'}[err.code] || '現在地を取得できませんでした。';
    showToast(msg);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

function collectionOrderGroupPrefix(staff, day) {
  return `${staff}||${day}||`;
}

function collectionOrderSnapshot() {
  return {
    orders:{ ...draftCollectionOrders },
    initialResetGroups:[...collectionOrderInitialResetGroups]
  };
}

function selectedCollectionOrderPrefixes() {
  return [...assignmentFilter.staff].flatMap(staff =>
    [...assignmentFilter.days].map(day => collectionOrderGroupPrefix(staff, day))
  );
}

function nextCollectionOrder(staff, day) {
  const prefix = collectionOrderGroupPrefix(staff, day);
  let max = 0;
  Object.keys(draftCollectionOrders).forEach(key => {
    if (!key.startsWith(prefix)) return;
    const order = normalizedCollectionOrder(draftCollectionOrders[key]);
    if (order !== null) max = Math.max(max, order);
  });
  return max + 1;
}

function insertCollectionOrder(item, requestedOrder) {
  const groupPrefix = collectionOrderGroupPrefix(item.staff, item.day);
  const oldOrder = normalizedCollectionOrder(draftCollectionOrders[item.key]);
  delete draftCollectionOrders[item.key];

  if (oldOrder !== null) {
    Object.keys(draftCollectionOrders).forEach(key => {
      if (!key.startsWith(groupPrefix)) return;
      const order = normalizedCollectionOrder(draftCollectionOrders[key]);
      if (order !== null && order > oldOrder) draftCollectionOrders[key] = order - 1;
    });
  }

  Object.keys(draftCollectionOrders).forEach(key => {
    if (!key.startsWith(groupPrefix)) return;
    const order = normalizedCollectionOrder(draftCollectionOrders[key]);
    if (order !== null && order >= requestedOrder) draftCollectionOrders[key] = order + 1;
  });
  draftCollectionOrders[item.key] = requestedOrder;
}

// テーブル描画
function renderTable() {
  document.getElementById('btnSaturdayAdd').hidden = currentSheetName !== SATURDAY_PERMIT_SHEET;
  const q = searchInput.value.trim().toLowerCase();
  const visArr = [...visibleCols].sort((a,b) => a-b);
  dataTable.classList.toggle('compact-columns', !assignmentFilter.active && visArr.length < headers.length);
  dataTable.classList.toggle('assignment-mode', assignmentFilter.active);
  dataTable.classList.toggle('saturday-permit-sheet', currentSheetName === '土曜日許可物件表（休出用）');
  let assignmentRows = null;

  if (!headers.length) {
    document.getElementById('collectionOrderActions').classList.remove('active');
    dataTable.style.display='none'; emptyMsg.style.display='block';
    emptyMsg.textContent='データがありません'; updateStatus('— データなし —');
    return;
  }

  // フィルター適用
  let rows = dataArray.filter(row => {
    if (filterState.colIdx !== null && filterState.selectedValues.size > 0) {
      const v = String(row[filterState.colIdx] || '').trim();
      if (filterState.filterType === 'prefix') {
        let ok = false;
        for (const sel of filterState.selectedValues) {
          if (sel.startsWith('\x00exact:')) { if (v === sel.slice(7)) { ok=true; break; } }
          // 接頭辞グループ（H-…）に入るのは「記号＋番号」の値だけ。
          // 値そのものが H- の行は単独項目として別に出しているので、ここでは拾わない。
          else { if (extractPrefix(v) === sel) { ok=true; break; } }
        }
        if (!ok) return false;
      } else {
        if (!filterState.selectedValues.has(v)) return false;
      }
    }
    return !q || row.some(c => String(c).toLowerCase().includes(q));
  });

  if (assignmentFilter.active) {
    const staffOrder = new Map(ASSIGNMENT_STAFF.map((v, i) => [v, i]));
    const dayOrder = new Map(ASSIGNMENT_DAYS.map((v, i) => [v, i]));
    const assignments = [];
    rows.forEach((row, sourceIndex) => {
      assignmentFilter.days.forEach(day => {
        const dayCol = headers.findIndex(h => String(h || '').trim() === day);
        if (dayCol < 0) return;
        const value = String(row[dayCol] || '').trim().replace('－', '-');
        const staff = [...assignmentFilter.staff].find(prefix => value.startsWith(prefix));
        if (!staff) return;
        const suffix = value.slice(staff.length).match(/\d+/);
        const key = assignmentRowKey(row, staff, day);
        assignments.push({
          row,
          staff,
          day,
          key,
          staffValue:value,
          collectionOrder:normalizedCollectionOrder(draftCollectionOrders[key]),
          order:suffix ? Number(suffix[0]) : Number.MAX_SAFE_INTEGER,
          sourceIndex
        });
      });
    });
    assignments.sort((a, b) =>
      (staffOrder.get(a.staff) - staffOrder.get(b.staff)) ||
      (dayOrder.get(a.day) - dayOrder.get(b.day)) ||
      ((a.collectionOrder === null) - (b.collectionOrder === null)) ||
      ((a.collectionOrder ?? Number.MAX_SAFE_INTEGER) - (b.collectionOrder ?? Number.MAX_SAFE_INTEGER)) ||
      (a.order - b.order) ||
      (a.sourceIndex - b.sourceIndex)
    );
    assignmentRows = assignments;
    rows = assignments.map(item => item.row);
  }

  if (!assignmentFilter.active && sortState.col >= 0 && sortState.dir !== 0) {
    const ci = sortState.col;
    const isWeekdayColumn = /^[月火水木金土日]曜日$/.test(String(headers[ci] || '').trim());
    rows = [...rows].sort((a,b) => {
      const va=String(a[ci]||'').trim(), vb=String(b[ci]||'').trim();
      if(va===''&&vb==='') return 0;
      if(va==='') return 1; if(vb==='') return -1;
      if(isWeekdayColumn) return weekdayAssignmentCmp(va, vb, sortState.dir);
      return sortState.dir * natCmp(va,vb);
    });
  }

  // ヘッダー描画
  tableHead.innerHTML='';
  if (!assignmentFilter.active && currentSheetName === '土曜日許可物件表（休出用）') {
    const groupRow = document.createElement('tr');
    groupRow.className = 'saturday-group-row';
    [
      { label:'内回り', start:0, end:2, includesRowNumber:true },
      { label:'外回り', start:3, end:6 },
      { label:'ダンボール', start:7, end:10 },
    ].forEach(group => {
      const visibleCount = visArr.filter(ci => ci >= group.start && ci <= group.end).length
        + (group.includesRowNumber ? 1 : 0);
      if (!visibleCount) return;
      const th = document.createElement('th');
      th.colSpan = visibleCount;
      const titleBox = document.createElement('div');
      titleBox.className = 'saturday-title-box';
      titleBox.textContent = group.label;
      th.appendChild(titleBox);
      groupRow.appendChild(th);
    });

  }
  const htr = document.createElement('tr');
  const thN = document.createElement('th');
  thN.textContent='順番'; thN.style.cursor='default'; thN.style.minWidth='48px';
  htr.appendChild(thN);
  if (assignmentFilter.active) {
    ['地区名', '物件名', '収集順', '担当者情報'].forEach(label => {

    visArr.forEach(ci => {

      let label = headers[ci] || `列${ci+1}`;

        const vals = [...filterState.selectedValues]
          .map(v => v.startsWith('\x00exact:') ? (v.slice(7)||'空白') : v)

        label += ` 🔽${vals}`;
      }
      th.textContent = label;

  if (!assignmentFilter.active && currentSheetName === '土曜日許可物件表（休出用）') {

  tableHead.appendChild(htr);

  displayedRows = rows;  // 保存用に保持

  // ボディ描画

        const groupRow = document.createElement('tr');

    }
    const tr = document.createElement('tr');
    const tdN = document.createElement('td');
    tdN.className='rn'; tdN.textContent=ri+1; tr.appendChild(tdN);
    const districtCol = headers.findIndex(h => ['地区', '地区名'].includes(String(h || '').trim()));

document.getElementById('collectionOrderUndo').addEventListener('click', () => {
  const previous = collectionOrderUndoStack.pop();
  if (!previous) {
    showToast('戻せる変更はありません');
    return;
  }
  draftCollectionOrders = previous.orders ? { ...previous.orders } : { ...previous };
  collectionOrderInitialResetGroups = new Set(previous.initialResetGroups || []);
  renderTable();
});

document.getElementById('collectionOrderReset').addEventListener('click', () => {
  collectionOrderUndoStack.push(collectionOrderSnapshot());
  const selectedPrefixes = selectedCollectionOrderPrefixes();
  const restored = { ...draftCollectionOrders };
  Object.keys(restored).forEach(key => {
    if (selectedPrefixes.some(prefix => key.startsWith(prefix))) delete restored[key];
  });
  Object.entries(collectionOrderSessionOrders).forEach(([key, value]) => {
    if (selectedPrefixes.some(prefix => key.startsWith(prefix))) restored[key] = value;
  });
  selectedPrefixes.forEach(prefix => collectionOrderInitialResetGroups.delete(prefix));
  draftCollectionOrders = restored;
  renderTable();
  showToast('変更前の設定へ全て戻しました');
});

document.getElementById('collectionOrderInitialize').addEventListener('click', () => {
  collectionOrderUndoStack.push(collectionOrderSnapshot());
  const selectedPrefixes = selectedCollectionOrderPrefixes();
  Object.keys(draftCollectionOrders).forEach(key => {
    if (selectedPrefixes.some(prefix => key.startsWith(prefix))) delete draftCollectionOrders[key];
  });
  selectedPrefixes.forEach(prefix => collectionOrderInitialResetGroups.add(prefix));
  renderTable();
  showToast('番号なしの初期設定に戻しました。保存して反映を押してください');
});

function getCollectionOrderMailTo() {
  const requiredAddresses = [
    'annsyuu38@gmail.com',
    'yuno.uejma@gmail.com',
    'kankyoubu.itaku@gmail.com'
  ];
  try {
    const list = JSON.parse(localStorage.getItem('keiryo_mail_list') || '[]');
    const selectedAddresses = Array.isArray(list)
      ? list.filter(item => item && item.enabled && item.addr).map(item => item.addr.trim()).filter(Boolean)
      : [];
    const addresses = [...selectedAddresses, ...requiredAddresses].filter((address, index, all) =>
      all.findIndex(item => item.toLowerCase() === address.toLowerCase()) === index
    );
    return addresses.join(',');
  } catch(e) {
    return requiredAddresses.join(',');
  }

function openCollectionOrderMail() {
  const districtCol = headers.findIndex(h => ['地区', '地区名'].includes(String(h || '').trim()));
  const propertyCol = headers.findIndex(h => ['契約物件', '物件名', '名前'].includes(String(h || '').trim()));
  const entered = displayedAssignmentRows.filter(item => normalizedCollectionOrder(committedCollectionOrders[item.key]) !== null);
  if (!entered.length) {
    showToast('収集順を入力してください');
    return false;
  }
  const lines = [
    '【物件表・収集順変更】',
    `ファイル：${currentFilename}`,
    `シート：${currentSheetName}`,
    `担当者：${[...assignmentFilter.staff].join('、')}`,
    `曜日：${[...assignmentFilter.days].join('、')}`,
    `入力済み：${entered.length}件（途中保存を含む）`,
    '─────────────────'
  ];
  let lastStaff = '';
  entered.forEach(item => {
    if (item.staff !== lastStaff) {
      lastStaff = item.staff;
      lines.push(`【${item.staff} 担当】`);
    }
    const district = districtCol >= 0 ? String(item.row[districtCol] || '').trim() : '';
    const property = propertyCol >= 0 ? String(item.row[propertyCol] || '').trim() : '';
    lines.push(`収集順 ${committedCollectionOrders[item.key]}：${district}｜${property}｜${item.day}`);
  });
  lines.push('─────────────────', `決定日時：${new Date().toLocaleString('ja-JP')}`);
  const subject = encodeURIComponent(`物件表 収集順変更 ${currentSheetName}`);
  const body = encodeURIComponent(lines.join('\r\n'));
  const link = document.createElement('a');
  link.href = `mailto:${getCollectionOrderMailTo()}?subject=${subject}&body=${body}`;
  link.target = '_top';
  link.rel = 'noopener';
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  setTimeout(() => link.remove(), 1000);
  return true;
}

function applyCollectionOrdersToWeekdayCells() {
  const changes = [];
  const propertyCol = findHeaderIndex(['契約物件', '物件名', '名前']);
  displayedAssignmentRows.forEach(item => {
    const order = normalizedCollectionOrder(draftCollectionOrders[item.key]);
    const dayCol = headers.findIndex(h => String(h || '').trim() === item.day);
    if (dayCol < 0) return;
    const groupPrefix = collectionOrderGroupPrefix(item.staff, item.day);
    if (order === null && !collectionOrderInitialResetGroups.has(groupPrefix)) return;
    const nextValue = order === null ? item.staff : `${item.staff}${order}`;
    const before = String(item.row[dayCol] || '').trim();
    if (before === nextValue) return;
    item.row[dayCol] = nextValue;
    changes.push({
      row:item.row,
      staff:item.staff,
      day:item.day,
      dayCol,
      property:propertyCol >= 0 ? String(item.row[propertyCol] || '').trim() : '',
      before,
      after:nextValue
    });
  });
  return changes;
}

function saveCollectionOrderProgress(applyToWeekdayCells = false) {
  clearTimeout(collectionOrderRenderTimer);
  committedCollectionOrders = { ...draftCollectionOrders };
  const changes = applyToWeekdayCells ? applyCollectionOrdersToWeekdayCells() : [];
  if (applyToWeekdayCells) {
    recordCollectionOrderChanges(changes);
    collectionOrderInitialResetGroups = new Set();
    collectionOrderSessionOrders = { ...committedCollectionOrders };
  }
  collectionOrderUndoStack = [];
  saveState();
  renderTable();
  return changes.length;
}

function captureVisibleCollectionOrderInputs() {
  const inputs = [...document.querySelectorAll('.collection-order-input')];
  inputs.forEach((input, index) => {
    const item = displayedAssignmentRows[index];
    if (!item) return;
    // 未登録のまま手入力もされていない欄の値は、画面に出しているだけの候補番号。
    // これを保存すると触っていない物件に番号が入ってしまうので対象外にする。
    if (input.dataset.registered === 'false' && input.dataset.edited !== 'true') {
      delete draftCollectionOrders[item.key];
      return;
    }
    const order = normalizedCollectionOrder(input.value);
    if (order === null) delete draftCollectionOrders[item.key];
    else draftCollectionOrders[item.key] = order;
  });
}

// ===== 保存機能 =====
function getTimestamp() {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

function makeTimestampedName(filename) {
  const stem = filename.replace(/\.xlsx$/i, '');
  const datedPropertyTable = stem.match(/^(2026年度物件表_KMN置換_列移動)(?:_\d{4}-\d{2}-\d{2})?(?:_\d{8}_\d{4,6})?$/);
  if (datedPropertyTable) {
    return `${datedPropertyTable[1]}_${getTimestamp()}.xlsx`;
  }
  return `${stem.replace(/_\d{8}_\d{4,6}$/, '')}_${getTimestamp()}.xlsx`;
}

function doSaveExcel(filename) {
  if (!workbook || !headers.length) {
    showToast('⚠️ 保存するデータがありません');
    return;
  }
  syncCurrentSheetToWorkbook();
  syncHiddenPropertySheetToWorkbook();
  const savedBuffer = XLSX.write(workbook, { bookType:'xlsx', type:'array', cellStyles:true, compression:true });
  XLSX.writeFile(workbook, filename, { bookType:'xlsx', cellStyles:true, compression:true });
  currentFilename = filename;
  showLocalFileOption(filename);
  storeLastWorkbook(savedBuffer, filename);
  saveState();
  recordExcelSave(filename);
  updateStatus('保存したファイル名：' + filename);
  showToast('✅ 全シートを保持して ' + filename + ' を保存しました');
}

(function() {

  const colPanel  = document.getElementById('colPanel');
  const wrapper   = document.getElementById('tableWrapper');
  const header    = document.getElementById('app-header');

  function adjustHeights() {
    const hdH = header ? header.offsetHeight : 44;
    toolbar.style.top = hdH + 'px';
    const tbH = toolbar.offsetHeight;
    const cpH = colPanel.classList.contains('active') ? colPanel.offsetHeight : 0;

    else wrapper.style.height = 'calc(100vh - ' + (hdH + tbH + cpH) + 'px)';
  }

  window.toggleToolbar = function() {
    const collapsed = toolbar.classList.toggle('collapsed');

    toggleBtn.setAttribute('aria-expanded',String(!collapsed));
    setTimeout(adjustHeights, 230);
    try { localStorage.setItem('colview_toolbar_collapsed', collapsed ? '1' : '0'); } catch(e) {}
  };

  // 初期状態復元
  try {

      toolbar.classList.add('collapsed');
      toggleBtn.textContent = '▼ 操作パネルを表示';
      toggleBtn.setAttribute('aria-expanded','false');

<script>
(function(){
  const RESUME_KEY = 'ueno_seisou_resume_v1';
  const PAGE = 'index_2-4_colview.html';
  let timer = null;
  function saveResume(){
    try {
      localStorage.setItem(RESUME_KEY, JSON.stringify({page: PAGE, scrollY: window.scrollY || 0, tableTop: document.getElementById('tableWrapper')?.scrollTop || 0, updatedAt: Date.now()}));
    } catch(e) {}
  }
  window.addEventListener('load', () => {
    try {
      const r = JSON.parse(localStorage.getItem(RESUME_KEY) || 'null');
      if(r && r.page === PAGE) setTimeout(() => {
        window.scrollTo(0, r.scrollY || 0);
        const w = document.getElementById('tableWrapper');
        if(w && typeof r.tableTop === 'number') w.scrollTop = r.tableTop;
      }, 250);
    } catch(e) {}
    saveResume();
  });
  window.addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(saveResume, 250);
  }, {passive:true});
  const wrapper = document.getElementById('tableWrapper');
  if(wrapper) wrapper.addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(saveResume, 250);
  }, {passive:true});
  window.addEventListener('pagehide', saveResume);
})();
</script>

<!-- 履歴パネル -->
<div id="hist-overlay" onclick="closeHistPanel()"></div>
<div id="hist-panel">
  <div id="hist-panel-hdr">
    <span>物件の変更履歴</span>
    <button onclick="closeHistPanel()">✕</button>
  </div>
  <div class="property-history-section">
    <label style="display:flex;align-items:center;gap:10px;padding:12px;"><input type="checkbox" id="propertyHistoryShowSent" checked>送信済みも表示</label>
    <div id="property-change-list"></div>
    <div class="property-history-actions">
      <button type="button" onclick="sendSelectedPropertyHistory()">選択してメール送信</button>
      <button type="button" onclick="removeSelectedPropertyHistory()">履歴を削除</button>
    </div>
  </div>
  <button id="hist-close-btn" type="button" onclick="closeHistPanel()">閉じる</button>
</div>

<script>
// ===== 物件の変更履歴機能 =====
(function() {
  function fmtTime(ts) {
    const d = new Date(ts), p = n => String(n).padStart(2,'0');
    return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  const propertyTypeLabels = { register:'新規登録', update:'既存情報の変更', hide:'非表示', restore:'非表示から戻す', collection_order:'収集順の保存・変更', saturday_permit_add:'土曜日許可物件の追加', excel_save:'エクセル保存' };
  const showSent=document.getElementById('propertyHistoryShowSent');
  try{showSent.checked=localStorage.getItem('property_history_show_sent')!=='0';}catch(e){}
  showSent.onchange=()=>{try{localStorage.setItem('property_history_show_sent',showSent.checked?'1':'0');}catch(e){}window.renderPropertyChangeHistory();};

  async function undoHistoryField(id,position){
    const history=getPropertyChangeHistory(),item=history.find(entry=>entry.id===id),field=item?.changes?.[position];
    if(!field||field.revertedAt)return;
    if(item.filename!==currentFilename||item.sheetName!==currentSheetName){alert('履歴と同じファイル・シートを開いてください。');return;}
    const registrationCol=findHeaderIndex(['登録番号']),propertyCol=findHeaderIndex(['契約物件','物件名','名前']);
    let candidates=[];
    if(item.type==='update'&&registrationCol>=0)candidates=dataArray.filter(row=>String(row[registrationCol]??'')===String(item.row[registrationCol]??''));
    if(item.type==='collection_order'){
      if(field.registration&&registrationCol>=0)candidates=dataArray.filter(row=>String(row[registrationCol]??'')===String(field.registration));
      else {const name=field.property||String(field.header).match(/（(.*)）$/)?.[1];if(name&&propertyCol>=0)candidates=dataArray.filter(row=>String(row[propertyCol])===name);}
    }
    const c=Number(field.index);
    if(candidates.length!==1||!Number.isInteger(c)||c<0||c>=headers.length){alert('変更場所を確実に特定できないため戻せません。');return;}
    const row=candidates[0];
    if(String(row[c]??'')!==String(field.after??'')){alert('この項目はその後変更されています。上書きを防ぐため戻しません。');return;}
    if(String(headers[c]).trim()==='整理番号'){alert('整理番号は他の物件と連動しています。編集用物件表で番号を変更してください。');return;}
    if(!await propertyConfirm(`${field.header}\n${field.after||'未選択'} → ${field.before||'未選択'}\nこの変更を戻しますか？`))return;
    const before=row[c];row[c]=field.before??'';
    const correction={id:`pc-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,timestamp:Date.now(),type:'update',row:[...row],summary:propertyRowInfo(row),changes:[{index:c,header:String(headers[c]),before,after:row[c]}],filename:currentFilename,sheetName:currentSheetName,sentAt:null};
    field.revertedAt=Date.now();history.unshift(correction);setPropertyChangeHistory(history);
    propertyEditorApplied=true;syncCurrentSheetToWorkbook();saveState();renderTable();window.renderPropertyChangeHistory();showToast('変更を戻して保存しました');
  }

  window.renderPropertyChangeHistory = function() {
    const host = document.getElementById('property-change-list');
    if (!host) return;
    const items = getPropertyChangeHistory().filter(item=>showSent.checked||!item.sentAt);
    const dateKey=item=>new Date(item.timestamp).toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
    const expanded=new Set([...host.querySelectorAll('details[open][data-tree-key]')].map(node=>node.dataset.treeKey));
    const checkedIds=new Set(selectedPropertyHistoryIds());
    host.innerHTML = '';
    if (!items.length) {
      const empty = document.createElement('div');
      empty.id = 'hist-empty';
      empty.textContent = showSent.checked?'物件の変更履歴はありません':'未送信の変更履歴はありません';
      host.appendChild(empty);
      return;
    }
    const propertyCol = findHeaderIndex(['契約物件', '物件名', '名前']);
    const orderCol = findHeaderIndex(['整理番号']);
    const registrationCol = findHeaderIndex(['登録番号']);
    const displayItems=[],orderGroups=new Map();
    items.forEach(item=>{
      const orderOnly=item.type==='update'&&item.changes?.length&&item.changes.every(field=>String(field.header).trim()==='整理番号');
      if(!orderOnly){displayItems.push(item);return;}
      const key=JSON.stringify([dateKey(item),item.filename,item.sheetName,item.sentAt?'sent':'unsent']);
      let group=orderGroups.get(key);
      if(!group){group={...item,summary:{property:'整理番号の変更',district:'',registration:'',order:0},groupIds:[],changes:[],groupedOrders:true};orderGroups.set(key,group);displayItems.push(group);}
      group.groupIds.push(item.id);
      item.changes.forEach(field=>group.changes.push({...field,header:`${item.summary?.property||'物件'}：整理番号`}));
    });
    const dates=new Map();
    [...new Set(displayItems.map(dateKey))].sort().reverse().forEach(date=>{
      const section=document.createElement('details'),summary=document.createElement('summary'),check=document.createElement('input'),title=document.createElement('span'),children=document.createElement('div');
      section.dataset.treeKey=date;section.open=expanded.has(date);section.style.cssText='border-bottom:1px solid #aaa;padding:10px 0;';
      summary.style.cssText='display:flex;align-items:center;gap:12px;cursor:pointer;padding:8px;';
      check.type='checkbox';check.className='property-history-date-check';check.setAttribute('aria-label',`${date}を全選択`);check.style.cssText='width:22px;height:22px;';
      check.onclick=event=>event.stopPropagation();
      const groups=displayItems.filter(item=>dateKey(item)===date);
      title.textContent=`${date}（${groups.length}件）`;
      const opener=document.createElement('span');opener.textContent=section.open?'閉じる':'開く';opener.style.marginLeft='auto';section.addEventListener('toggle',()=>opener.textContent=section.open?'閉じる':'開く');
      children.style.cssText='margin-left:16px;border-left:1px solid #ccc;padding-left:8px;';
      summary.append(check,title,opener);section.append(summary,children);host.append(section);
      check.onchange=()=>{children.querySelectorAll('.property-change-check').forEach(input=>input.checked=check.checked);check.indeterminate=false;};
      dates.set(date,{children,check});
    });
    function syncDate(date){const group=dates.get(date),checks=[...group.children.querySelectorAll('.property-change-check')];group.check.checked=checks.length>0&&checks.every(input=>input.checked);group.check.indeterminate=!group.check.checked&&checks.some(input=>input.checked);}
    displayItems.forEach(item => {
      const label = document.createElement('div');
      label.className = `property-change-item${item.sentAt ? ' sent' : ''}`;
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox'; checkbox.className = 'property-change-check'; checkbox.value = item.id;
      if(item.groupIds)checkbox.dataset.historyIds=JSON.stringify(item.groupIds);
      checkbox.checked=!item.sentAt&&(item.groupIds||[item.id]).every(id=>checkedIds.has(id));
      checkbox.setAttribute('aria-label',`${item.summary?.property||'変更'}を選択`);
      checkbox.onchange=()=>syncDate(dateKey(item));
      const body = document.createElement('div');
      const name = document.createElement('div'); name.className = 'property-change-name';
      const savedSummary = item.summary || {};
      const property = savedSummary.property || (propertyCol >= 0 ? String(item.row[propertyCol] || '') : '') || '名称未入力';
      name.textContent = `${propertyTypeLabels[item.type] || '変更'}：${property}`;
      const meta = document.createElement('div'); meta.className = 'property-change-meta';
      const order = savedSummary.order || (orderCol >= 0 ? String(item.row[orderCol] || '') : '') || '-';
      const registration = savedSummary.registration || (registrationCol >= 0 ? String(item.row[registrationCol] || '') : '') || '-';
      meta.textContent = `整理番号 ${order}／登録番号 ${registration}／${fmtTime(item.timestamp)}／${item.sentAt ? `送信済み ${fmtTime(item.sentAt)}` : '未送信'}`;
      if(item.type==='saturday_permit_add')meta.textContent=`${savedSummary.group||'土曜日'} ${order}番／${savedSummary.district||'-'}／${fmtTime(item.timestamp)}／${item.sentAt?`送信済み ${fmtTime(item.sentAt)}`:'未送信'}`;
      if(item.groupedOrders)meta.textContent=`${item.groupIds.length}件／${item.sentAt?'送信済み':'未送信'}`;
      body.append(name, meta);
      if (Array.isArray(item.changes) && item.changes.length) {
        const detail = document.createElement('div');
        detail.className = 'property-change-detail';
        const changeTexts = item.changes.map(field => item.type === 'excel_save'
          ? `保存したファイル名：${field.after || item.filename}`
          : `${field.header || `列${Number(field.index) + 1}`}：${field.before || '未選択'} → ${field.after || '未選択'}`
        );
        changeTexts.forEach((text,index)=>{
          const line=document.createElement('div');line.style.cssText='display:flex;align-items:center;gap:12px;margin:8px 0;';
          const description=document.createElement('span');description.textContent=text;line.append(description);
          if(!item.groupedOrders&&(item.type==='update'||item.type==='collection_order')){
            const button=document.createElement('button');button.type='button';button.textContent=item.changes[index].revertedAt?'戻しました':'戻す';button.disabled=!!item.changes[index].revertedAt;
            button.dataset.ownConfirmation='true';
            button.style.cssText='flex-shrink:0;padding:6px 12px;background:white;color:black;border:1px solid #999;border-radius:4px;';
            button.onclick=event=>{event.preventDefault();event.stopPropagation();undoHistoryField(item.id,index);};line.append(button);
          }
          detail.append(line);
        });
        const folded=document.createElement('details'),summary=document.createElement('summary');folded.dataset.treeKey=item.id;folded.open=expanded.has(item.id);summary.textContent=`変更内容を開く（${item.changes.length}件）`;folded.append(summary,detail);body.append(folded);
      }
      label.append(checkbox, body); dates.get(dateKey(item)).children.appendChild(label);
    });
    dates.forEach((_,date)=>syncDate(date));
  };

  function selectedPropertyHistoryIds() {
    return [...document.querySelectorAll('.property-change-check:checked')].flatMap(input => input.dataset.historyIds?JSON.parse(input.dataset.historyIds):[input.value]);
  }

  window.sendSelectedPropertyHistory = function() {
    const ids = new Set(selectedPropertyHistoryIds());
    const history = getPropertyChangeHistory();
    const selected = history.filter(item => ids.has(item.id));
    if (!selected.length) { showToast('送信する変更履歴を選択してください（送信済みも再送できます）'); return; }
    if (!sendPropertyChangeMail(selected)) return;
    const sentAt = Date.now();
    history.forEach(item => { if (ids.has(item.id) && !item.sentAt) item.sentAt = sentAt; });
    setPropertyChangeHistory(history);
    pendingPropertyChanges = pendingPropertyChanges.filter(change => !selected.some(item => item.type === change.type && JSON.stringify(item.row) === JSON.stringify(change.row)));
    window.renderPropertyChangeHistory();
    showToast(`${selected.length}件のメール画面を開きました。閉じた場合も再度開けます`);
  };

  window.removeSelectedPropertyHistory = async function() {
    const ids = new Set(selectedPropertyHistoryIds());
    const history = getPropertyChangeHistory();
    const removable = history.filter(item => ids.has(item.id));
    if (!removable.length) { showToast('削除する履歴を選択してください'); return; }
    if (!await propertyConfirm(`選択した${removable.length}件の履歴を削除しますか？\n削除した履歴は元に戻せません。物件表のデータは変更されません。`)) return;
    setPropertyChangeHistory(history.filter(item => !ids.has(item.id)));
    window.renderPropertyChangeHistory();
    showToast(`${removable.length}件の履歴を削除しました`);
  };

  window.toggleHistPanel = function() {
    const panel = document.getElementById('hist-panel');
    const overlay = document.getElementById('hist-overlay');
    if (panel.classList.contains('open')) {
      panel.classList.remove('open'); overlay.classList.remove('show');
    } else {
      window.renderPropertyChangeHistory(); panel.classList.add('open'); overlay.classList.add('show');
    }
  };
  window.openPropertyHistoryPanel = function() {
    window.renderPropertyChangeHistory();
    document.getElementById('hist-panel').classList.add('open');
    document.getElementById('hist-overlay').classList.add('show');
  };
  window.closeHistPanel = function() {
    document.getElementById('hist-panel').classList.remove('open');
    document.getElementById('hist-overlay').classList.remove('show');
  };
})();
</script>
