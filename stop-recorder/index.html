<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>停車地点記録（テスト）</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>停車地点記録（テスト）</h1><span class="edition">v1.0</span></div><button id="settingsButton" title="記録設定" aria-label="記録設定">設定</button></header>
<main>
 <section class="record-controls">
  <div class="session-row"><select id="sessionSelect" aria-label="記録を選択"></select><span id="savedState" role="status">端末保存</span></div>
  <div class="identity"><label>担当者<input id="person" autocomplete="name" placeholder="担当者名"></label><label>日付<input id="date" type="date"></label></div>
  <div class="commands"><button id="start" class="primary">開始</button><button id="pause">一時停止</button><button id="finish">終了</button></div>
  <div class="status-row"><span id="status" class="state">待機中</span><span id="gps">GPS 未取得</span><span id="count">0 地点</span></div>
  <div class="progress"><div id="progressBar"></div></div><div class="metrics"><span id="candidate">停車時間 0:00</span><span id="threshold">判定 1:00</span></div>
 </section>
 <p class="notice">記録中はこの画面を表示してください。画面ロック・別アプリへの切り替えで一時停止します。</p>
 <p id="message" role="status" aria-live="polite" hidden></p>
 <section class="workspace">
  <div class="map-area"><div id="map" aria-label="記録地点の地図"></div><div class="map-tools"><button id="fit" title="全地点を表示">全地点</button><button id="locate" title="現在地を表示">現在地</button></div><p id="mapError" hidden>地図を読み込めません。地点一覧は利用できます。</p></div>
  <div class="list-area"><div class="list-heading"><h2>記録地点</h2><span id="recordDate"></span></div><div class="file-actions"><button id="saveFile">ファイル保存</button><button id="loadFile">読み込み</button><input id="fileInput" type="file" accept="application/json,.json" hidden></div><div id="list"></div><div class="list-footer"><button id="renumber">連番に整える</button><button id="deleteSession" class="danger">この記録を削除</button></div></div>
 </section>
</main>
<dialog id="settingsDialog"><form id="settingsForm"><h2>記録設定</h2><label>停車時間（秒）<input name="seconds" type="number" min="5" max="1800" step="1" required></label><label>停車とみなす範囲（m）<input name="radius" type="number" min="10" max="200" step="1" required></label><label>許容するGPS誤差（m）<input name="accuracy" type="number" min="5" max="200" step="1" required></label><div class="dialog-actions"><button type="button" data-close="settingsDialog">キャンセル</button><button class="primary">保存</button></div></form></dialog>
<dialog id="editDialog"><form id="editForm"><h2>地点の編集</h2><label>順番<input name="order" type="number" min="1" max="99999" step="1" required></label><label>物件名・メモ<input name="name" maxlength="160"></label><label>緯度<input name="lat" type="number" step="any" min="-90" max="90" required></label><label>経度<input name="lng" type="number" step="any" min="-180" max="180" required></label><div class="dialog-actions"><button type="button" data-close="editDialog">キャンセル</button><button class="primary">保存</button></div></form></dialog>
<dialog id="confirmDialog"><h2 id="confirmTitle">確認</h2><p id="confirmText"></p><div class="dialog-actions"><button id="confirmCancel">キャンセル</button><button id="confirmOK" class="primary">OK</button></div></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="core.js"></script><script src="app.js"></script>
</body></html>
